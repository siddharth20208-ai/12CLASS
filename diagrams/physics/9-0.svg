<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="black"/></marker>
<marker id="arR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
</defs>
<!-- wire with current I -->
<line x1="100" y1="250" x2="500" y2="250" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
<text x="90" y="275" font-size="14">I</text>

<!-- current element dl highlighted -->
<line x1="290" y1="250" x2="330" y2="250" stroke="#c0392b" stroke-width="5"/>
<text x="290" y="240" font-size="14" fill="#c0392b">dl</text>

<!-- line from element to point P -->
<line x1="310" y1="250" x2="480" y2="120" stroke="#1a5276" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="490" y="115" font-size="16">P</text>
<circle cx="480" cy="120" r="3" fill="black"/>
<circle cx="480" cy="120" r="2.5" fill="none" stroke="black" stroke-width="1.5"/>
<text x="500" y="135" font-size="14">dB (out of page)</text>

<!-- angle theta -->
<path d="M340,250 A40,40 0 0 0 322,218" stroke="#117864" stroke-width="1.5" fill="none"/>
<text x="345" y="225" font-size="14" fill="#117864">theta</text>
<text x="400" y="190" font-size="14">r</text>

<text x="150" y="330" font-size="14">Biot-Savart Law: field dB at P due to current element dl</text>
</svg>
