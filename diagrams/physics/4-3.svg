<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- LEFT: Pendulum -->
  <text x="150" y="30" font-size="16" text-anchor="middle" font-weight="bold">Simple Pendulum</text>
  <!-- support -->
  <line x1="100" y1="50" x2="200" y2="50" stroke="black" stroke-width="2"/>
  <line x1="110" y1="50" x2="100" y2="60" stroke="black" stroke-width="1"/>
  <line x1="130" y1="50" x2="120" y2="60" stroke="black" stroke-width="1"/>
  <line x1="150" y1="50" x2="140" y2="60" stroke="black" stroke-width="1"/>
  <line x1="170" y1="50" x2="160" y2="60" stroke="black" stroke-width="1"/>
  <line x1="190" y1="50" x2="180" y2="60" stroke="black" stroke-width="1"/>
  <!-- vertical dashed reference -->
  <line x1="150" y1="50" x2="150" y2="230" stroke="black" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- string displaced by theta -->
  <line x1="150" y1="50" x2="195" y2="220" stroke="black" stroke-width="2"/>
  <text x="165" y="90" font-size="15">L</text>
  <!-- angle arc -->
  <path d="M150,90 A40,40 0 0 1 162,89" fill="none" stroke="#2980b9" stroke-width="1.5"/>
  <text x="156" y="108" font-size="14" fill="#2980b9">theta</text>
  <!-- bob -->
  <circle cx="195" cy="225" r="14" fill="#f1c40f" stroke="black" stroke-width="2"/>
  <text x="195" y="255" font-size="14" text-anchor="middle">bob</text>
  <!-- restoring force arrow pointing back toward vertical -->
  <line x1="195" y1="225" x2="160" y2="218" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="205" font-size="14" fill="#c0392b">Restoring force</text>

  <!-- divider -->
  <line x1="320" y1="40" x2="320" y2="360" stroke="black" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- RIGHT: Spring-mass -->
  <text x="480" y="30" font-size="16" text-anchor="middle" font-weight="bold">Spring-Mass System</text>
  <!-- ceiling -->
  <line x1="440" y1="50" x2="520" y2="50" stroke="black" stroke-width="2"/>
  <line x1="450" y1="50" x2="440" y2="60" stroke="black" stroke-width="1"/>
  <line x1="470" y1="50" x2="460" y2="60" stroke="black" stroke-width="1"/>
  <line x1="490" y1="50" x2="480" y2="60" stroke="black" stroke-width="1"/>
  <line x1="510" y1="50" x2="500" y2="60" stroke="black" stroke-width="1"/>
  <!-- spring (zigzag) -->
  <path d="M480,50 L470,65 L490,75 L470,85 L490,95 L470,105 L490,115 L480,130"
        fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="90" font-size="15">k</text>
  <!-- equilibrium dashed line -->
  <line x1="420" y1="160" x2="560" y2="160" stroke="black" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="565" y="164" font-size="13">equilibrium</text>
  <!-- mass displaced down by x -->
  <rect x="460" y="200" width="40" height="40" fill="#f1c40f" stroke="black" stroke-width="2"/>
  <text x="480" y="225" font-size="14" text-anchor="middle">m</text>
  <!-- x bracket -->
  <line x1="420" y1="160" x2="420" y2="200" stroke="#2980b9" stroke-width="1.5"/>
  <text x="400" y="185" font-size="14" fill="#2980b9">x</text>
  <!-- restoring force arrow pointing up toward equilibrium -->
  <line x1="480" y1="200" x2="480" y2="168" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="190" font-size="14" fill="#c0392b">Restoring force</text>
</svg>
