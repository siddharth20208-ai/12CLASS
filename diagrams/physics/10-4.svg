<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="black"/>
</marker>
</defs>

<!-- axes -->
<line x1="80" y1="340" x2="580" y2="340" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<line x1="80" y1="340" x2="80" y2="60" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<text x="590" y="345" font-size="16">T</text>
<text x="60" y="55" font-size="16">chi</text>

<!-- hyperbola-like curve falling steeply -->
<path d="M100,80 C150,180 220,260 580,320" stroke="#c0392b" stroke-width="2" fill="none"/>

<text x="300" y="30" font-size="16" text-anchor="middle">Curie's Law: chi is inversely proportional to T</text>
<text x="300" y="370" font-size="14" text-anchor="middle">Temperature (T)</text>

</svg>
