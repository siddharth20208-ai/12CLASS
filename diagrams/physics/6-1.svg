<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect width="640" height="400" fill="#ffffff"/>
<defs>
<marker id="arrow61" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
</marker>
</defs>
<text x="320" y="24" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">Young's Double Slit Experiment</text>

<text x="60" y="205" text-anchor="middle" font-size="14" fill="#1a1a1a">S</text>
<circle cx="60" cy="210" r="4" fill="#1a1a1a"/>
<line x1="64" y1="208" x2="130" y2="195" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow61)"/>
<line x1="64" y1="212" x2="130" y2="225" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow61)"/>

<!-- single slit -->
<rect x="130" y="60" width="6" height="130" fill="#1a1a1a"/>
<rect x="130" y="230" width="6" height="130" fill="#1a1a1a"/>
<text x="133" y="50" text-anchor="middle" font-size="13" fill="#1a1a1a">single slit</text>

<!-- double slit -->
<rect x="260" y="60" width="6" height="128" fill="#1a1a1a"/>
<rect x="260" y="196" width="6" height="28" fill="#1a1a1a"/>
<rect x="260" y="232" width="6" height="128" fill="#1a1a1a"/>
<text x="275" y="195" font-size="13" fill="#2a6fdb">S1</text>
<text x="275" y="228" font-size="13" fill="#2a6fdb">S2</text>
<text x="263" y="50" text-anchor="middle" font-size="13" fill="#1a1a1a">double slit</text>
<line x1="263" y1="205" x2="263" y2="217" stroke="#2a6fdb" stroke-width="2"/>
<text x="245" y="214" text-anchor="end" font-size="13" fill="#2a6fdb">d</text>

<!-- lines to screen -->
<line x1="266" y1="205" x2="540" y2="150" stroke="#2a6fdb" stroke-width="1.2"/>
<line x1="266" y1="205" x2="540" y2="260" stroke="#2a6fdb" stroke-width="1.2"/>
<line x1="266" y1="217" x2="540" y2="150" stroke="#d9534f" stroke-width="1.2"/>
<line x1="266" y1="217" x2="540" y2="260" stroke="#d9534f" stroke-width="1.2"/>

<!-- screen -->
<line x1="540" y1="60" x2="540" y2="360" stroke="#1a1a1a" stroke-width="3"/>
<text x="540" y="380" text-anchor="middle" font-size="13" fill="#1a1a1a">screen</text>

<!-- fringes -->
<line x1="520" y1="110" x2="560" y2="110" stroke="#1a1a1a" stroke-width="5"/>
<line x1="520" y1="155" x2="560" y2="155" stroke="#aaaaaa" stroke-width="2" stroke-dasharray="2,2"/>
<line x1="520" y1="200" x2="560" y2="200" stroke="#1a1a1a" stroke-width="5"/>
<line x1="520" y1="245" x2="560" y2="245" stroke="#aaaaaa" stroke-width="2" stroke-dasharray="2,2"/>
<line x1="520" y1="290" x2="560" y2="290" stroke="#1a1a1a" stroke-width="5"/>

<line x1="567" y1="110" x2="567" y2="200" stroke="#2a9d3a" stroke-width="1.5"/>
<line x1="563" y1="110" x2="571" y2="110" stroke="#2a9d3a" stroke-width="1.5"/>
<line x1="563" y1="200" x2="571" y2="200" stroke="#2a9d3a" stroke-width="1.5"/>
<text x="578" y="158" font-size="13" fill="#2a9d3a">w</text>

<line x1="320" y1="380" x2="540" y2="380" stroke="#1a1a1a" stroke-width="1"/>
<text x="430" y="395" text-anchor="middle" font-size="13" fill="#1a1a1a">D</text>

</svg>
