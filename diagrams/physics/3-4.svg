<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="g1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="80" y1="340" x2="580" y2="340" stroke="black" stroke-width="2" marker-end="url(#g1)"/>
  <line x1="80" y1="340" x2="80" y2="50" stroke="black" stroke-width="2" marker-end="url(#g1)"/>
  <text x="600" y="345" font-size="16">V</text>
  <text x="65" y="45" font-size="16">P</text>

  <!-- Carnot cycle loop: 4 points -->
  <!-- 1: top-left, 2: top-right (after isothermal expansion), 3: bottom-right (after adiabatic expansion), 4: bottom-left (after isothermal compression) -->
  <path d="M 180 110 Q 300 130 380 170" fill="none" stroke="#2980b9" stroke-width="2.5" marker-end="url(#g1)"/>
  <path d="M 380 170 Q 450 220 480 290" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#g1)"/>
  <path d="M 480 290 Q 380 320 280 300" fill="none" stroke="#2980b9" stroke-width="2.5" marker-end="url(#g1)"/>
  <path d="M 280 300 Q 200 250 180 110" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#g1)"/>

  <circle cx="180" cy="110" r="4" fill="black"/>
  <circle cx="380" cy="170" r="4" fill="black"/>
  <circle cx="480" cy="290" r="4" fill="black"/>
  <circle cx="280" cy="300" r="4" fill="black"/>

  <text x="160" y="100" font-size="15">1</text>
  <text x="390" y="160" font-size="15">2</text>
  <text x="490" y="285" font-size="15">3</text>
  <text x="260" y="300" font-size="15">4</text>

  <text x="280" y="135" font-size="13" fill="#2980b9">1-2 isothermal expansion (T1)</text>
  <text x="440" y="220" font-size="13" fill="#c0392b">2-3 adiabatic expansion</text>
  <text x="330" y="330" font-size="13" fill="#2980b9">3-4 isothermal compression (T2)</text>
  <text x="90" y="200" font-size="13" fill="#c0392b">4-1 adiabatic compression</text>
</svg>
