<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="black"/>
</marker>
</defs>

<!-- axes -->
<line x1="80" y1="220" x2="580" y2="220" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<line x1="320" y1="360" x2="320" y2="60" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<text x="585" y="225" font-size="16">H</text>
<text x="330" y="55" font-size="16">B</text>

<!-- single closed hysteresis loop -->
<path d="M460,90
         C410,100 360,120 320,150
         C290,172 250,195 220,220
         C195,241 165,290 140,330
         C170,310 220,290 320,280
         C370,274 410,250 420,220
         C430,190 440,150 460,90 Z"
      stroke="#c0392b" stroke-width="2" fill="none"/>

<!-- saturation points -->
<circle cx="460" cy="90" r="4" fill="black"/>
<text x="465" y="85" font-size="14">+Saturation</text>
<circle cx="140" cy="330" r="4" fill="black"/>
<text x="40" y="345" font-size="14">-Saturation</text>

<!-- retentivity: curve crosses B-axis at positive value -->
<circle cx="320" cy="150" r="4" fill="#1a5276"/>
<text x="330" y="140" font-size="14" fill="#1a5276">Retentivity</text>

<!-- coercivity: curve crosses H-axis at negative value -->
<circle cx="220" cy="220" r="4" fill="#1a5276"/>
<text x="100" y="250" font-size="14" fill="#1a5276">Coercivity</text>

</svg>
