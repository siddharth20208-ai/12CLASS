<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
</marker>
<marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="black"/>
</marker>
</defs>
<!-- outer loop top -->
<path d="M80,100 L320,100" stroke="black" stroke-width="2" fill="none"/>
<path d="M320,100 L560,100" stroke="black" stroke-width="2" fill="none"/>
<path d="M80,100 L80,300" stroke="black" stroke-width="2" fill="none"/>
<path d="M560,100 L560,300" stroke="black" stroke-width="2" fill="none"/>
<path d="M80,300 L320,300" stroke="black" stroke-width="2" fill="none"/>
<path d="M320,300 L560,300" stroke="black" stroke-width="2" fill="none"/>
<!-- middle shared branch -->
<path d="M320,100 L320,300" stroke="black" stroke-width="2" fill="none"/>

<!-- battery left loop (on left vertical) -->
<line x1="80" y1="170" x2="80" y2="180" stroke="black" stroke-width="4"/>
<line x1="80" y1="190" x2="80" y2="210" stroke="black" stroke-width="2"/>
<text x="55" y="195" font-size="14">Battery 1</text>

<!-- resistor left loop (on top) -->
<rect x="150" y="92" width="50" height="16" fill="none" stroke="black" stroke-width="2"/>
<text x="150" y="85" font-size="14">R1</text>

<!-- battery right loop (right vertical) -->
<line x1="560" y1="170" x2="560" y2="180" stroke="black" stroke-width="4"/>
<line x1="560" y1="190" x2="560" y2="210" stroke="black" stroke-width="2"/>
<text x="570" y="195" font-size="14">Battery 2</text>

<!-- resistor right loop (top) -->
<rect x="400" y="92" width="50" height="16" fill="none" stroke="black" stroke-width="2"/>
<text x="410" y="85" font-size="14">R2</text>

<!-- junction point -->
<circle cx="320" cy="100" r="4" fill="black"/>
<text x="326" y="95" font-size="14">Junction</text>

<!-- current arrows at junction -->
<line x1="260" y1="140" x2="312" y2="104" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="230" y="150" font-size="14" fill="#c0392b">I1</text>

<line x1="320" y1="108" x2="320" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="328" y="140" font-size="14" fill="#c0392b">I2</text>

<line x1="328" y1="104" x2="380" y2="140" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="385" y="150" font-size="14" fill="#c0392b">I3</text>

<!-- loop direction curved arrows -->
<path d="M150,200 A60,60 0 1 1 210,160" stroke="#1a5276" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>
<text x="130" y="230" font-size="14" fill="#1a5276">Loop 1</text>

<path d="M430,160 A60,60 0 1 1 490,200" stroke="#1a5276" stroke-width="2" fill="none" marker-end="url(#arrowB)"/>
<text x="470" y="230" font-size="14" fill="#1a5276">Loop 2</text>

</svg>
