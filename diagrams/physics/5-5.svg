<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="320" y="26" font-size="16" text-anchor="middle" font-weight="bold">Resonance Tube Experiment</text>

  <!-- tuning fork above tube -->
  <rect x="270" y="60" width="10" height="55" fill="#7f8c8d"/>
  <path d="M275,60 L275,30 M255,30 L255,65 M295,30 L295,65" fill="none" stroke="black" stroke-width="3"/>
  <text x="340" y="50" font-size="14">Tuning fork</text>

  <!-- glass tube outline -->
  <line x1="230" y1="115" x2="230" y2="340" stroke="black" stroke-width="2"/>
  <line x1="330" y1="115" x2="330" y2="340" stroke="black" stroke-width="2"/>
  <line x1="230" y1="340" x2="330" y2="340" stroke="black" stroke-width="2"/>

  <!-- water fill -->
  <rect x="232" y="260" width="96" height="78" fill="#aed6f1"/>
  <line x1="232" y1="260" x2="328" y2="260" stroke="#2980b9" stroke-width="2"/>

  <!-- L1 water level (lower resonance length marking from open top to level1) -->
  <line x1="190" y1="115" x2="190" y2="200" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="165" y="160" font-size="14" fill="#c0392b">L1</text>
  <line x1="200" y1="200" x2="330" y2="200" stroke="black" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="340" y="204" font-size="13">1st resonance level</text>

  <!-- L2 water level (second, lower level) -->
  <line x1="160" y1="115" x2="160" y2="260" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="135" y="190" font-size="14" fill="#27ae60">L2</text>
  <line x1="200" y1="260" x2="330" y2="260" stroke="black" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="340" y="264" font-size="13">2nd resonance level</text>

  <text x="280" y="360" font-size="13" text-anchor="middle">Water</text>
  <text x="280" y="110" font-size="13" text-anchor="middle">Open end</text>
</svg>
