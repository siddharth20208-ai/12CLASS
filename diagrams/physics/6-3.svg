<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect width="640" height="400" fill="#ffffff"/>
<text x="320" y="24" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">Single Slit Diffraction</text>

<!-- incoming plane wavefronts -->
<line x1="60" y1="150" x2="130" y2="150" stroke="#2a6fdb" stroke-width="2"/>
<line x1="60" y1="170" x2="130" y2="170" stroke="#2a6fdb" stroke-width="2"/>
<line x1="60" y1="190" x2="130" y2="190" stroke="#2a6fdb" stroke-width="2"/>
<line x1="60" y1="210" x2="130" y2="210" stroke="#2a6fdb" stroke-width="2"/>

<!-- slit -->
<rect x="160" y="60" width="6" height="110" fill="#1a1a1a"/>
<rect x="160" y="220" width="6" height="110" fill="#1a1a1a"/>
<line x1="163" y1="170" x2="163" y2="220" stroke="#d9534f" stroke-width="2"/>
<text x="185" y="200" font-size="14" fill="#d9534f">a</text>

<!-- diverging rays -->
<line x1="166" y1="195" x2="470" y2="100" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="166" y1="195" x2="470" y2="195" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="166" y1="195" x2="470" y2="290" stroke="#1a1a1a" stroke-width="1.2"/>

<!-- intensity graph on screen -->
<line x1="470" y1="60" x2="470" y2="340" stroke="#1a1a1a" stroke-width="2"/>
<path d="M 470 195 L 490 195 Q 510 50 530 195 Q 550 195 560 195" fill="none" stroke="#2a9d3a" stroke-width="2"/>
<path d="M 490 195 Q 500 160 505 195" fill="none" stroke="#2a9d3a" stroke-width="2"/>
<path d="M 530 195 Q 545 160 555 195" fill="none" stroke="#2a9d3a" stroke-width="2"/>

<text x="510" y="45" text-anchor="middle" font-size="13" fill="#2a9d3a">central maximum</text>
<line x1="490" y1="195" x2="490" y2="215" stroke="#d9534f" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="490" y="230" text-anchor="middle" font-size="13" fill="#d9534f">1st minimum</text>

<text x="470" y="355" text-anchor="middle" font-size="13" fill="#1a1a1a">screen</text>
</svg>
