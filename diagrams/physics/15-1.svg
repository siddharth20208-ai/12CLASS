<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>
  <text x="320" y="20" font-size="16" text-anchor="middle" fill="black">p-n Junction: Forward and Reverse Bias</text>

  <!-- Forward bias (left) -->
  <text x="160" y="55" font-size="15" text-anchor="middle" fill="black">Forward Bias</text>
  <rect x="150" y="90" width="12" height="40" fill="#c0392b"/>
  <text x="130" y="145" font-size="13" fill="black">p-side</text>
  <path d="M 162 90 L 162 130 L 190 110 Z" fill="black"/>
  <rect x="190" y="95" width="8" height="30" fill="black"/>
  <text x="180" y="145" font-size="13" fill="black">n-side</text>
  <rect x="165" y="100" width="20" height="20" fill="#d5dbdb" opacity="0.7"/>
  <text x="100" y="182" font-size="13" fill="black">depletion region (thin)</text>

  <line x1="120" y1="110" x2="120" y2="200" stroke="black" stroke-width="2"/>
  <line x1="230" y1="110" x2="230" y2="200" stroke="black" stroke-width="2"/>
  <line x1="120" y1="200" x2="150" y2="200" stroke="black" stroke-width="2"/>
  <line x1="200" y1="200" x2="230" y2="200" stroke="black" stroke-width="2"/>
  <line x1="150" y1="185" x2="150" y2="215" stroke="black" stroke-width="3"/>
  <line x1="165" y1="192" x2="165" y2="208" stroke="black" stroke-width="1.5"/>
  <line x1="165" y1="200" x2="185" y2="200" stroke="black" stroke-width="2"/>
  <line x1="185" y1="185" x2="185" y2="215" stroke="black" stroke-width="3"/>
  <line x1="200" y1="192" x2="200" y2="208" stroke="black" stroke-width="1.5"/>
  <text x="140" y="230" font-size="12" fill="black">+   battery   -</text>
  <line x1="120" y1="110" x2="150" y2="110" stroke="black" stroke-width="2"/>
  <line x1="198" y1="110" x2="230" y2="110" stroke="black" stroke-width="2"/>
  <text x="130" y="100" font-size="12" fill="#c0392b">+</text>
  <text x="205" y="100" font-size="12" fill="#2874a6">-</text>
  <line x1="120" y1="163" x2="230" y2="163" stroke="#1e8449" stroke-width="2" marker-end="url(#arrowH)"/>
  <text x="130" y="160" font-size="12" fill="#1e8449">current flows</text>

  <!-- Reverse bias (right) -->
  <text x="480" y="55" font-size="15" text-anchor="middle" fill="black">Reverse Bias</text>
  <rect x="470" y="90" width="12" height="40" fill="#c0392b"/>
  <text x="450" y="145" font-size="13" fill="black">p-side</text>
  <path d="M 482 90 L 482 130 L 510 110 Z" fill="black"/>
  <rect x="510" y="95" width="8" height="30" fill="black"/>
  <text x="500" y="145" font-size="13" fill="black">n-side</text>
  <rect x="478" y="90" width="38" height="40" fill="#d5dbdb" opacity="0.5"/>
  <text x="430" y="175" font-size="13" fill="black">depletion region (wide)</text>

  <line x1="440" y1="110" x2="440" y2="200" stroke="black" stroke-width="2"/>
  <line x1="550" y1="110" x2="550" y2="200" stroke="black" stroke-width="2"/>
  <line x1="440" y1="200" x2="470" y2="200" stroke="black" stroke-width="2"/>
  <line x1="520" y1="200" x2="550" y2="200" stroke="black" stroke-width="2"/>
  <line x1="470" y1="185" x2="470" y2="215" stroke="black" stroke-width="3"/>
  <line x1="485" y1="192" x2="485" y2="208" stroke="black" stroke-width="1.5"/>
  <line x1="485" y1="200" x2="505" y2="200" stroke="black" stroke-width="2"/>
  <line x1="505" y1="185" x2="505" y2="215" stroke="black" stroke-width="3"/>
  <line x1="520" y1="192" x2="520" y2="208" stroke="black" stroke-width="1.5"/>
  <text x="460" y="230" font-size="12" fill="black">-   battery   +</text>
  <line x1="440" y1="110" x2="470" y2="110" stroke="black" stroke-width="2"/>
  <line x1="518" y1="110" x2="550" y2="110" stroke="black" stroke-width="2"/>
  <text x="450" y="100" font-size="12" fill="#2874a6">-</text>
  <text x="525" y="100" font-size="12" fill="#c0392b">+</text>
</svg>
