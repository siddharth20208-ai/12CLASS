<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="black"/></marker>
</defs>
<!-- left: circular loop -->
<ellipse cx="160" cy="180" rx="100" ry="60" fill="none" stroke="black" stroke-width="2"/>
<path d="M60,180 a100,60 0 0 1 10,-20" stroke="black" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<text x="60" y="40" font-size="16">Circular loop, current I</text>
<!-- field lines through centre, perpendicular to plane -->
<line x1="160" y1="180" x2="160" y2="80" stroke="#1a5276" stroke-width="2" marker-end="url(#ar)"/>
<line x1="160" y1="180" x2="160" y2="290" stroke="#1a5276" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="170" y="120" font-size="14" fill="#1a5276">B at centre</text>

<!-- right: straight vertical wire -->
<line x1="440" y1="60" x2="440" y2="340" stroke="black" stroke-width="2" marker-end="url(#ar)"/>
<text x="450" y="70" font-size="14">I</text>
<ellipse cx="440" cy="200" rx="40" ry="18" fill="none" stroke="#117864" stroke-width="1.5" stroke-dasharray="4,3"/>
<ellipse cx="440" cy="200" rx="70" ry="32" fill="none" stroke="#117864" stroke-width="1.5" stroke-dasharray="4,3"/>
<ellipse cx="440" cy="200" rx="100" ry="46" fill="none" stroke="#117864" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="330" y="170" font-size="14" fill="#117864">B at distance r</text>
<text x="400" y="190" font-size="12" fill="#117864">r</text>
<line x1="440" y1="200" x2="510" y2="200" stroke="#117864" stroke-width="1" stroke-dasharray="2,2"/>

<text x="320" y="330" font-size="16">Straight wire</text>
<text x="170" y="380" font-size="12">(right-hand thumb rule gives field direction)</text>
</svg>
