<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="black"/>
</marker>
<marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
</marker>
</defs>

<!-- bar magnet -->
<rect x="60" y="180" width="120" height="40" fill="none" stroke="black" stroke-width="2"/>
<line x1="120" y1="180" x2="120" y2="220" stroke="black" stroke-width="2"/>
<text x="90" y="205" font-size="16" text-anchor="middle">N</text>
<text x="150" y="205" font-size="16" text-anchor="middle">S</text>

<!-- motion arrow -->
<line x1="190" y1="200" x2="240" y2="200" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<text x="200" y="185" font-size="14">v</text>

<!-- coil -->
<path d="M300,150 q15,10 0,20 q15,10 0,20 q15,10 0,20 q15,10 0,20 q15,10 0,20" stroke="black" stroke-width="2" fill="none"/>
<text x="300" y="130" font-size="14" text-anchor="middle">Coil</text>

<!-- flux lines through coil -->
<line x1="260" y1="160" x2="340" y2="160" stroke="#1a5276" stroke-width="2" marker-end="url(#arr)"/>
<line x1="260" y1="200" x2="340" y2="200" stroke="#1a5276" stroke-width="2" marker-end="url(#arr)"/>
<line x1="260" y1="240" x2="340" y2="240" stroke="#1a5276" stroke-width="2" marker-end="url(#arr)"/>
<text x="300" y="270" font-size="14" fill="#1a5276" text-anchor="middle">Flux (phi)</text>

<!-- wires to galvanometer -->
<path d="M300,150 L300,100 L480,100 L480,160" stroke="black" stroke-width="2" fill="none"/>
<path d="M300,250 L300,300 L480,300 L480,240" stroke="black" stroke-width="2" fill="none"/>

<circle cx="480" cy="200" r="40" stroke="black" stroke-width="2" fill="none"/>
<text x="480" y="205" font-size="16" text-anchor="middle">G</text>

<!-- induced current direction arrow -->
<path d="M380,95 L420,95" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>
<text x="380" y="80" font-size="14" fill="#c0392b">Induced current I</text>

<!-- galvanometer deflection -->
<line x1="480" y1="200" x2="505" y2="175" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>
<text x="500" y="165" font-size="14" fill="#c0392b">Deflection</text>

</svg>
