<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<!-- metre bridge wire on scale -->
<line x1="100" y1="150" x2="540" y2="150" stroke="black" stroke-width="3"/>
<text x="90" y="140" font-size="14">A</text>
<text x="545" y="140" font-size="14">B</text>
<!-- scale ticks -->
<line x1="100" y1="155" x2="100" y2="165" stroke="black" stroke-width="1"/>
<line x1="540" y1="155" x2="540" y2="165" stroke="black" stroke-width="1"/>
<text x="90" y="180" font-size="12">0 cm</text>
<text x="520" y="180" font-size="12">100 cm</text>

<!-- X resistor on left gap -->
<rect x="130" y="80" width="50" height="16" fill="none" stroke="black" stroke-width="2"/>
<line x1="100" y1="150" x2="100" y2="88" stroke="black" stroke-width="2"/>
<line x1="100" y1="88" x2="130" y2="88" stroke="black" stroke-width="2"/>
<line x1="180" y1="88" x2="320" y2="88" stroke="black" stroke-width="2"/>
<line x1="320" y1="88" x2="320" y2="150" stroke="black" stroke-width="2"/>
<text x="140" y="75" font-size="14">X</text>

<!-- R resistor on right gap -->
<rect x="380" y="80" width="50" height="16" fill="none" stroke="black" stroke-width="2"/>
<line x1="320" y1="88" x2="380" y2="88" stroke="black" stroke-width="2"/>
<line x1="430" y1="88" x2="540" y2="88" stroke="black" stroke-width="2"/>
<line x1="540" y1="88" x2="540" y2="150" stroke="black" stroke-width="2"/>
<text x="390" y="75" font-size="14">R</text>

<!-- battery and key below main wire A-B -->
<line x1="100" y1="150" x2="100" y2="260" stroke="black" stroke-width="2"/>
<line x1="540" y1="150" x2="540" y2="260" stroke="black" stroke-width="2"/>
<line x1="100" y1="260" x2="540" y2="260" stroke="black" stroke-width="2"/>
<line x1="305" y1="260" x2="305" y2="240" stroke="black" stroke-width="4"/>
<line x1="315" y1="252" x2="315" y2="248" stroke="black" stroke-width="2"/>
<line x1="295" y1="260" x2="295" y2="240" stroke="black" stroke-width="2"/>
<text x="260" y="280" font-size="14">Battery + Key</text>

<!-- galvanometer and jockey -->
<circle cx="320" cy="230" r="20" fill="none" stroke="black" stroke-width="2"/>
<text x="312" y="235" font-size="16">G</text>
<line x1="320" y1="210" x2="320" y2="150" stroke="black" stroke-width="2"/>
<!-- jockey touching wire at balance point -->
<line x1="320" y1="140" x2="320" y2="150" stroke="#c0392b" stroke-width="3"/>
<circle cx="320" cy="150" r="3" fill="#c0392b"/>
<text x="330" y="130" font-size="14" fill="#c0392b">Jockey (balance point J)</text>

<!-- length l from left end -->
<path d="M100,195 L320,195" stroke="#1a5276" stroke-width="1.5"/>
<text x="190" y="190" font-size="14" fill="#1a5276">l</text>

</svg>
