<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<!-- potentiometer wire AB -->
<line x1="80" y1="110" x2="560" y2="110" stroke="black" stroke-width="3"/>
<text x="65" y="105" font-size="16">A</text>
<text x="565" y="105" font-size="16">B</text>

<!-- driver battery -->
<line x1="80" y1="110" x2="80" y2="60" stroke="black" stroke-width="2"/>
<line x1="560" y1="110" x2="560" y2="60" stroke="black" stroke-width="2"/>
<line x1="80" y1="60" x2="300" y2="60" stroke="black" stroke-width="2"/>
<line x1="315" y1="60" x2="560" y2="60" stroke="black" stroke-width="2"/>
<line x1="300" y1="45" x2="300" y2="75" stroke="black" stroke-width="4"/>
<line x1="315" y1="50" x2="315" y2="70" stroke="black" stroke-width="2"/>
<text x="280" y="35" font-size="14">Driver cell</text>

<!-- two cells side by side -->
<line x1="140" y1="235" x2="140" y2="255" stroke="black" stroke-width="4"/>
<line x1="150" y1="240" x2="150" y2="250" stroke="black" stroke-width="2"/>
<text x="110" y="270" font-size="14">Cell 1</text>

<line x1="220" y1="235" x2="220" y2="255" stroke="black" stroke-width="4"/>
<line x1="230" y1="240" x2="230" y2="250" stroke="black" stroke-width="2"/>
<text x="200" y="270" font-size="14">Cell 2</text>

<!-- two-way key -->
<rect x="150" y="190" width="80" height="24" fill="none" stroke="black" stroke-width="2"/>
<text x="155" y="185" font-size="14">Two-way key</text>
<line x1="190" y1="190" x2="190" y2="160" stroke="black" stroke-width="2"/>

<!-- wiring from cells to key -->
<line x1="140" y1="235" x2="140" y2="214" stroke="black" stroke-width="2"/>
<line x1="220" y1="235" x2="220" y2="214" stroke="black" stroke-width="2"/>
<line x1="140" y1="280" x2="220" y2="280" stroke="black" stroke-width="2"/>
<line x1="140" y1="255" x2="140" y2="280" stroke="black" stroke-width="2"/>
<line x1="220" y1="255" x2="220" y2="280" stroke="black" stroke-width="2"/>
<line x1="180" y1="280" x2="180" y2="320" stroke="black" stroke-width="2"/>

<!-- galvanometer -->
<circle cx="230" cy="320" r="20" fill="none" stroke="black" stroke-width="2"/>
<text x="222" y="325" font-size="16">G</text>
<line x1="180" y1="320" x2="210" y2="320" stroke="black" stroke-width="2"/>
<line x1="190" y1="160" x2="190" y2="110" stroke="black" stroke-width="2"/>

<!-- galvanometer to jockey -->
<line x1="250" y1="320" x2="400" y2="320" stroke="black" stroke-width="2"/>
<line x1="400" y1="320" x2="400" y2="118" stroke="black" stroke-width="2"/>
<line x1="400" y1="110" x2="400" y2="118" stroke="#c0392b" stroke-width="3"/>
<circle cx="400" cy="110" r="3" fill="#c0392b"/>
<text x="340" y="100" font-size="14" fill="#c0392b">Jockey</text>

<!-- balance lengths -->
<path d="M80,150 L190,150" stroke="#1a5276" stroke-width="1.5"/>
<text x="110" y="145" font-size="14" fill="#1a5276">L1</text>
<path d="M80,170 L400,170" stroke="#117864" stroke-width="1.5"/>
<text x="250" y="165" font-size="14" fill="#117864">L2</text>

</svg>
