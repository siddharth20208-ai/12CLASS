<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="e1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="80" y1="340" x2="580" y2="340" stroke="black" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="80" y1="340" x2="80" y2="50" stroke="black" stroke-width="2" marker-end="url(#e1)"/>
  <text x="600" y="345" font-size="16">V</text>
  <text x="65" y="45" font-size="16">P</text>

  <!-- Isothermal curve (gentler) -->
  <path d="M 120 90 Q 250 150 560 320" fill="none" stroke="#2980b9" stroke-width="2.5"/>
  <text x="400" y="290" font-size="14" fill="#2980b9">isothermal (PV = const)</text>

  <!-- Adiabatic curve (steeper) -->
  <path d="M 120 90 Q 180 220 320 320" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="200" y="250" font-size="14" fill="#c0392b">adiabatic (PV^gamma = const)</text>

  <circle cx="120" cy="90" r="4" fill="black"/>
</svg>
