<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>

<!-- common zero line -->
<line x1="60" y1="220" x2="580" y2="220" stroke="black" stroke-width="2"/>
<text x="40" y="225" font-size="14" text-anchor="end">0</text>
<text x="300" y="250" font-size="16" text-anchor="middle">chi (susceptibility)</text>

<!-- Diamagnetic: small bar below zero -->
<rect x="130" y="220" width="60" height="20" fill="#c0392b" stroke="black" stroke-width="2"/>
<text x="160" y="270" font-size="16" text-anchor="middle">Diamagnetic</text>
<text x="160" y="290" font-size="14" text-anchor="middle">(small negative)</text>

<!-- Paramagnetic: small bar above zero -->
<rect x="290" y="200" width="60" height="20" fill="#1a5276" stroke="black" stroke-width="2"/>
<text x="320" y="270" font-size="16" text-anchor="middle">Paramagnetic</text>
<text x="320" y="290" font-size="14" text-anchor="middle">(small positive)</text>

<!-- Ferromagnetic: tall bar above zero -->
<rect x="450" y="80" width="60" height="140" fill="#27ae60" stroke="black" stroke-width="2"/>
<text x="480" y="270" font-size="16" text-anchor="middle">Ferromagnetic</text>
<text x="480" y="290" font-size="14" text-anchor="middle">(large positive)</text>

<line x1="60" y1="330" x2="60" y2="60" stroke="black" stroke-width="2"/>
<text x="30" y="60" font-size="14">+</text>
<text x="30" y="335" font-size="14">-</text>

</svg>
