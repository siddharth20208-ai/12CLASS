<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="320" y="30" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Basic Logic Gate Symbols</text>

  <!-- AND gate -->
  <text x="100" y="65" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">AND Gate</text>
  <path d="M60,90 L60,170 L95,170 A40,40 0 0 0 95,90 Z" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="20" y1="105" x2="60" y2="105" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="20" y1="155" x2="60" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="135" y1="130" x2="170" y2="130" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="10" y="100" font-size="14" fill="#c0392b">A</text>
  <text x="10" y="160" font-size="14" fill="#c0392b">B</text>
  <text x="178" y="135" font-size="14" fill="#2c6fbb">Y = A.B</text>

  <!-- OR gate -->
  <text x="330" y="65" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">OR Gate</text>
  <path d="M265,90 Q300,90 320,130 Q300,170 265,170 Q285,130 265,90 Z" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="225" y1="105" x2="262" y2="105" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="225" y1="155" x2="262" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="320" y1="130" x2="360" y2="130" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="213" y="100" font-size="14" fill="#c0392b">A</text>
  <text x="213" y="160" font-size="14" fill="#c0392b">B</text>
  <text x="368" y="110" font-size="14" fill="#2c6fbb">Y = A+B</text>

  <!-- NOT gate -->
  <text x="520" y="65" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold">NOT Gate</text>
  <path d="M460,100 L460,160 L525,130 Z" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="533" cy="130" r="7" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="420" y1="130" x2="460" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="540" y1="130" x2="580" y2="130" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="135" font-size="14" fill="#c0392b">A</text>
  <text x="588" y="135" font-size="14" fill="#2c6fbb">Y = A'</text>

  <!-- Caption -->
  <text x="320" y="370" font-size="14" fill="#1a1a1a" text-anchor="middle">D-shape = AND, curved-shield shape = OR, triangle+bubble = NOT (inverter)</text>
</svg>
