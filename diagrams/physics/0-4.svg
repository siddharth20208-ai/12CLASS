<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="black"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c0392b"/>
    </marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2980b9"/>
    </marker>
  </defs>
  <!-- Inclined road -->
  <line x1="100" y1="300" x2="480" y2="150" stroke="black" stroke-width="3"/>
  <!-- ground reference -->
  <line x1="100" y1="300" x2="480" y2="300" stroke="black" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- angle theta -->
  <path d="M 160 300 A 60 60 0 0 0 150 262" fill="none" stroke="black" stroke-width="1"/>
  <text x="175" y="288" font-size="14">theta</text>

  <!-- Car box on incline -->
  <g transform="translate(300,207) rotate(-28)">
    <rect x="-30" y="-20" width="60" height="20" fill="#dde" stroke="black" stroke-width="2"/>
  </g>

  <!-- mg downward -->
  <line x1="300" y1="207" x2="300" y2="300" stroke="black" stroke-width="2" marker-end="url(#a1)"/>
  <text x="305" y="270" font-size="15">mg</text>

  <!-- N perpendicular to road -->
  <line x1="300" y1="207" x2="258" y2="100" stroke="#2980b9" stroke-width="2" marker-end="url(#a3)"/>
  <text x="220" y="100" font-size="15" fill="#2980b9">N</text>

  <!-- N cos theta component (vertical up) -->
  <line x1="300" y1="207" x2="300" y2="130" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a2)"/>
  <text x="305" y="150" font-size="14" fill="#c0392b">N cos(theta)</text>

  <!-- N sin theta component (horizontal, towards centre) -->
  <line x1="300" y1="207" x2="258" y2="207" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a2)"/>
  <text x="150" y="222" font-size="14" fill="#c0392b">N sin(theta)</text>

  <text x="140" y="330" font-size="14">Road surface (banked at angle theta)</text>
  <line x1="490" y1="300" x2="560" y2="300" stroke="black" stroke-width="1" marker-end="url(#a1)"/>
  <text x="490" y="320" font-size="13">to centre of curve</text>
</svg>
