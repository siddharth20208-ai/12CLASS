<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<!-- potentiometer wire AB -->
<line x1="80" y1="110" x2="560" y2="110" stroke="black" stroke-width="3"/>
<text x="65" y="105" font-size="16">A</text>
<text x="565" y="105" font-size="16">B</text>

<!-- driver battery -->
<line x1="80" y1="110" x2="80" y2="60" stroke="black" stroke-width="2"/>
<line x1="560" y1="110" x2="560" y2="60" stroke="black" stroke-width="2"/>
<line x1="80" y1="60" x2="300" y2="60" stroke="black" stroke-width="2"/>
<line x1="315" y1="60" x2="560" y2="60" stroke="black" stroke-width="2"/>
<line x1="300" y1="45" x2="300" y2="75" stroke="black" stroke-width="4"/>
<line x1="315" y1="50" x2="315" y2="70" stroke="black" stroke-width="2"/>
<text x="280" y="35" font-size="14">Driver cell</text>

<!-- test cell, key, resistance box R in series -->
<line x1="150" y1="110" x2="150" y2="180" stroke="black" stroke-width="2"/>
<line x1="150" y1="180" x2="200" y2="180" stroke="black" stroke-width="2"/>
<line x1="150" y1="195" x2="150" y2="215" stroke="black" stroke-width="4"/>
<line x1="138" y1="201" x2="138" y2="209" stroke="black" stroke-width="2"/>
<text x="90" y="230" font-size="14">Test cell</text>

<rect x="230" y="172" width="20" height="16" fill="none" stroke="black" stroke-width="2"/>
<text x="220" y="165" font-size="14">Key</text>
<line x1="200" y1="180" x2="230" y2="180" stroke="black" stroke-width="2"/>

<rect x="300" y="172" width="60" height="16" fill="none" stroke="black" stroke-width="2"/>
<text x="305" y="165" font-size="14">R box</text>
<line x1="250" y1="180" x2="300" y2="180" stroke="black" stroke-width="2"/>
<line x1="360" y1="180" x2="400" y2="180" stroke="black" stroke-width="2"/>

<!-- galvanometer-jockey branch separate -->
<line x1="150" y1="180" x2="150" y2="250" stroke="black" stroke-width="2"/>
<line x1="150" y1="250" x2="250" y2="250" stroke="black" stroke-width="2"/>
<circle cx="270" cy="250" r="20" fill="none" stroke="black" stroke-width="2"/>
<text x="262" y="255" font-size="16">G</text>
<line x1="290" y1="250" x2="430" y2="250" stroke="black" stroke-width="2"/>
<line x1="430" y1="250" x2="430" y2="118" stroke="black" stroke-width="2"/>
<line x1="430" y1="110" x2="430" y2="118" stroke="#c0392b" stroke-width="3"/>
<circle cx="430" cy="110" r="3" fill="#c0392b"/>
<text x="400" y="100" font-size="14" fill="#c0392b">Jockey</text>
<text x="400" y="180" font-size="12">(node joins test-cell branch)</text>

<!-- balance lengths -->
<path d="M80,150 L430,150" stroke="#1a5276" stroke-width="1.5"/>
<text x="240" y="145" font-size="14" fill="#1a5276">L1 (key open)</text>

<path d="M80,170 L330,170" stroke="#117864" stroke-width="1.5"/>
<text x="150" y="330" font-size="14" fill="#117864">L2 (key closed, R in circuit): balance shifts to a shorter length</text>

</svg>
