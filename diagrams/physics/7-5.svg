<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect width="640" height="400" fill="#ffffff"/>
<defs>
<marker id="arrow75" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
</marker>
</defs>
<text x="320" y="24" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">Dielectric in a Parallel Plate Capacitor</text>

<rect x="150" y="100" width="340" height="12" fill="#2a6fdb"/>
<rect x="150" y="260" width="340" height="12" fill="#d9534f"/>
<text x="130" y="110" text-anchor="end" font-size="14" fill="#2a6fdb">+Q</text>
<text x="130" y="270" text-anchor="end" font-size="14" fill="#d9534f">-Q</text>

<rect x="170" y="112" width="300" height="148" fill="#f0e6c8" opacity="0.7"/>
<text x="320" y="130" text-anchor="middle" font-size="14" fill="#1a1a1a">dielectric</text>

<g stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow75)">
<line x1="200" y1="112" x2="200" y2="258"/>
<line x1="440" y1="112" x2="440" y2="258"/>
</g>
<text x="205" y="175" font-size="13" fill="#1a1a1a">E</text>

<!-- induced dipoles -->
<g font-size="13">
<text x="270" y="170" fill="#2a9d3a">-</text>
<text x="270" y="200" fill="#2a9d3a">+</text>
<line x1="275" y1="175" x2="275" y2="195" stroke="#2a9d3a" stroke-width="1.5" marker-end="url(#arrow75)"/>

<text x="330" y="170" fill="#2a9d3a">-</text>
<text x="330" y="200" fill="#2a9d3a">+</text>
<line x1="335" y1="175" x2="335" y2="195" stroke="#2a9d3a" stroke-width="1.5" marker-end="url(#arrow75)"/>

<text x="390" y="170" fill="#2a9d3a">-</text>
<text x="390" y="200" fill="#2a9d3a">+</text>
<line x1="395" y1="175" x2="395" y2="195" stroke="#2a9d3a" stroke-width="1.5" marker-end="url(#arrow75)"/>
</g>
<text x="320" y="230" text-anchor="middle" font-size="13" fill="#2a9d3a">induced dipoles oppose E</text>

<text x="320" y="320" text-anchor="middle" font-size="14" fill="#1a1a1a">Reduced net field inside dielectric</text>
<line x1="230" y1="300" x2="410" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow75)"/>

</svg>
