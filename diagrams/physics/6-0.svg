<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="320" y="26" font-size="16" text-anchor="middle" font-weight="bold">Huygens' Construction of a New Wavefront</text>

  <!-- source -->
  <circle cx="80" cy="200" r="5" fill="black"/>
  <text x="80" y="225" font-size="14" text-anchor="middle">S</text>

  <!-- original wavefront arc -->
  <path d="M80,80 A170,170 0 0 1 80,320" fill="none" stroke="#2980b9" stroke-width="2.5"/>
  <text x="130" y="160" font-size="13" fill="#2980b9" text-anchor="middle">wavefront</text>

  <!-- secondary wavelets: points on arc and small circles -->
  <!-- points along arc at angles -60,-30,0,30,60 deg from S, radius 170 -->
  <g>
    <!-- compute approx coordinates -->
    <circle cx="165" cy="53" r="2.5" fill="#c0392b"/>
    <circle cx="227" cy="115" r="2.5" fill="#c0392b"/>
    <circle cx="250" cy="200" r="2.5" fill="#c0392b"/>
    <circle cx="227" cy="285" r="2.5" fill="#c0392b"/>
    <circle cx="165" cy="347" r="2.5" fill="#c0392b"/>

    <circle cx="165" cy="53" r="28" fill="none" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="227" cy="115" r="28" fill="none" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="250" cy="200" r="28" fill="none" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="227" cy="285" r="28" fill="none" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="165" cy="347" r="28" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  </g>
  <text x="500" y="60" font-size="12" fill="#27ae60" text-anchor="middle">secondary wavelet</text>
  <text x="500" y="76" font-size="12" fill="#27ae60" text-anchor="middle">(radius vt)</text>

  <!-- new wavefront tangent to all small circles -->
  <path d="M137,25 A198,198 0 0 1 137,375" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="330" y="360" font-size="13" fill="#c0392b" text-anchor="middle">new wavefront</text>

  <!-- rays from S perpendicular to wavefronts -->
  <line x1="80" y1="200" x2="275" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="80" y1="200" x2="245" y2="92" stroke="black" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="80" y1="200" x2="245" y2="308" stroke="black" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="135" y="215" font-size="13">ray</text>
</svg>
