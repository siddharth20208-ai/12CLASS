<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="black"/>
</marker>
<marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
</marker>
</defs>

<!-- field into page crosses -->
<g stroke="black" stroke-width="2">
<line x1="135" y1="105" x2="145" y2="115"/><line x1="145" y1="105" x2="135" y2="115"/>
<line x1="215" y1="105" x2="225" y2="115"/><line x1="225" y1="105" x2="215" y2="115"/>
<line x1="295" y1="105" x2="305" y2="115"/><line x1="305" y1="105" x2="295" y2="115"/>
<line x1="375" y1="105" x2="385" y2="115"/><line x1="385" y1="105" x2="375" y2="115"/>
<line x1="455" y1="105" x2="465" y2="115"/><line x1="465" y1="105" x2="455" y2="115"/>

<line x1="135" y1="185" x2="145" y2="195"/><line x1="145" y1="185" x2="135" y2="195"/>
<line x1="215" y1="185" x2="225" y2="195"/><line x1="225" y1="185" x2="215" y2="195"/>
<line x1="295" y1="185" x2="305" y2="195"/><line x1="305" y1="185" x2="295" y2="195"/>
<line x1="375" y1="185" x2="385" y2="195"/><line x1="385" y1="185" x2="375" y2="195"/>
<line x1="455" y1="185" x2="465" y2="195"/><line x1="465" y1="185" x2="455" y2="195"/>
</g>
<text x="480" y="150" font-size="16">B (into page)</text>

<!-- rails -->
<line x1="100" y1="100" x2="520" y2="100" stroke="black" stroke-width="2"/>
<line x1="100" y1="260" x2="520" y2="260" stroke="black" stroke-width="2"/>

<!-- sliding rod -->
<line x1="280" y1="100" x2="280" y2="260" stroke="#1a5276" stroke-width="3"/>
<text x="280" y="285" font-size="14" text-anchor="middle" fill="#1a5276">Rod</text>
<text x="280" y="80" font-size="14" text-anchor="middle">L</text>

<!-- velocity v -->
<line x1="300" y1="180" x2="360" y2="180" stroke="black" stroke-width="2" marker-end="url(#arr)"/>
<text x="320" y="165" font-size="14">v</text>

<!-- induced current in rod -->
<line x1="280" y1="230" x2="280" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>
<text x="250" y="150" font-size="14" fill="#c0392b">I (induced)</text>

<text x="310" y="340" font-size="14" text-anchor="middle">Motional EMF: rod moving right in field into page induces current (right-hand rule)</text>

</svg>
