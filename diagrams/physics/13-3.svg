<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="arrowS" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>
  <text x="320" y="20" font-size="16" text-anchor="middle" fill="black">Stopping Potential vs Frequency</text>

  <line x1="100" y1="330" x2="100" y2="60" stroke="black" stroke-width="2" marker-end="url(#arrowS)"/>
  <line x1="100" y1="330" x2="580" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrowS)"/>
  <text x="60" y="65" font-size="14" fill="black">V0</text>
  <text x="570" y="355" font-size="14" fill="black">v</text>

  <line x1="200" y1="330" x2="520" y2="90" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="200" cy="330" r="3" fill="#c0392b"/>
  <text x="180" y="350" font-size="14" fill="black">v0</text>
  <line x1="200" y1="330" x2="200" y2="335" stroke="black" stroke-width="2"/>

  <text x="380" y="170" font-size="14" fill="#c0392b">slope = h/e</text>
  <text x="300" y="130" font-size="14" fill="black">line: V0 = (h/e) v - (h/e) v0</text>
  <text x="195" y="310" font-size="13" fill="black">(threshold frequency)</text>
</svg>
