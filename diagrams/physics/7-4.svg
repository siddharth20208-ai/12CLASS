<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect width="640" height="400" fill="#ffffff"/>
<text x="160" y="24" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">Series</text>
<text x="480" y="24" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">Parallel</text>

<!-- Series circuit -->
<line x1="60" y1="300" x2="60" y2="100" stroke="#1a1a1a" stroke-width="2"/>
<line x1="60" y1="100" x2="110" y2="100" stroke="#1a1a1a" stroke-width="2"/>
<line x1="50" y1="190" x2="70" y2="190" stroke="#1a1a1a" stroke-width="3"/>
<line x1="45" y1="200" x2="75" y2="200" stroke="#1a1a1a" stroke-width="2"/>
<text x="40" y="225" text-anchor="middle" font-size="13" fill="#1a1a1a">battery</text>

<line x1="110" y1="100" x2="110" y2="300" stroke="#1a1a1a" stroke-width="2"/>
<!-- C1 -->
<line x1="100" y1="120" x2="120" y2="120" stroke="#2a6fdb" stroke-width="3"/>
<line x1="100" y1="135" x2="120" y2="135" stroke="#2a6fdb" stroke-width="3"/>
<text x="130" y="132" font-size="13" fill="#2a6fdb">C1</text>
<!-- C2 -->
<line x1="100" y1="175" x2="120" y2="175" stroke="#d9534f" stroke-width="3"/>
<line x1="100" y1="190" x2="120" y2="190" stroke="#d9534f" stroke-width="3"/>
<text x="130" y="187" font-size="13" fill="#d9534f">C2</text>

<line x1="110" y1="300" x2="60" y2="300" stroke="#1a1a1a" stroke-width="2"/>
<text x="140" y="250" font-size="13" fill="#1a1a1a">Q on both plates</text>

<!-- Parallel circuit -->
<line x1="380" y1="300" x2="380" y2="100" stroke="#1a1a1a" stroke-width="2"/>
<line x1="380" y1="100" x2="430" y2="100" stroke="#1a1a1a" stroke-width="2"/>
<line x1="370" y1="190" x2="390" y2="190" stroke="#1a1a1a" stroke-width="3"/>
<line x1="365" y1="200" x2="395" y2="200" stroke="#1a1a1a" stroke-width="2"/>
<text x="380" y="225" text-anchor="middle" font-size="13" fill="#1a1a1a">battery</text>

<line x1="430" y1="100" x2="430" y2="300" stroke="#1a1a1a" stroke-width="2"/>
<line x1="430" y1="100" x2="500" y2="100" stroke="#1a1a1a" stroke-width="2"/>
<line x1="430" y1="300" x2="500" y2="300" stroke="#1a1a1a" stroke-width="2"/>

<!-- C1 branch -->
<line x1="500" y1="100" x2="500" y2="180" stroke="#2a6fdb" stroke-width="2"/>
<line x1="490" y1="180" x2="510" y2="180" stroke="#2a6fdb" stroke-width="3"/>
<line x1="490" y1="195" x2="510" y2="195" stroke="#2a6fdb" stroke-width="3"/>
<line x1="500" y1="195" x2="500" y2="300" stroke="#2a6fdb" stroke-width="2"/>
<text x="515" y="165" font-size="13" fill="#2a6fdb">C1, Q1</text>

<!-- C2 branch -->
<line x1="560" y1="100" x2="560" y2="180" stroke="#d9534f" stroke-width="2"/>
<line x1="430" y1="100" x2="560" y2="100" stroke="#1a1a1a" stroke-width="2"/>
<line x1="550" y1="180" x2="570" y2="180" stroke="#d9534f" stroke-width="3"/>
<line x1="550" y1="195" x2="570" y2="195" stroke="#d9534f" stroke-width="3"/>
<line x1="560" y1="195" x2="560" y2="300" stroke="#d9534f" stroke-width="2"/>
<line x1="430" y1="300" x2="560" y2="300" stroke="#1a1a1a" stroke-width="2"/>
<text x="575" y="165" font-size="13" fill="#d9534f">C2, Q2</text>

<text x="480" y="340" text-anchor="middle" font-size="13" fill="#1a1a1a">Same V across C1 and C2</text>

</svg>
