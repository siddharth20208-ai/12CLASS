<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="black"/>
</marker>
<marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
</marker>
</defs>

<!-- metal plate -->
<rect x="200" y="100" width="240" height="200" fill="#eeeeee" stroke="black" stroke-width="2"/>
<text x="320" y="330" font-size="14" text-anchor="middle">Metal plate</text>

<!-- field lines through plate with increasing arrow -->
<line x1="260" y1="60" x2="260" y2="340" stroke="#1a5276" stroke-width="2" marker-end="url(#arr)"/>
<line x1="320" y1="60" x2="320" y2="340" stroke="#1a5276" stroke-width="2" marker-end="url(#arr)"/>
<line x1="380" y1="60" x2="380" y2="340" stroke="#1a5276" stroke-width="2" marker-end="url(#arr)"/>
<text x="460" y="55" font-size="14" fill="#1a5276">B increasing</text>

<!-- eddy current loops inside plate -->
<ellipse cx="270" cy="150" rx="30" ry="20" fill="none" stroke="#c0392b" stroke-width="2"/>
<path d="M300,150 a30,20 0 0 1 -60,0" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>

<ellipse cx="370" cy="150" rx="30" ry="20" fill="none" stroke="#c0392b" stroke-width="2"/>
<path d="M400,150 a30,20 0 0 1 -60,0" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>

<ellipse cx="270" cy="250" rx="30" ry="20" fill="none" stroke="#c0392b" stroke-width="2"/>
<path d="M300,250 a30,20 0 0 1 -60,0" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>

<ellipse cx="370" cy="250" rx="30" ry="20" fill="none" stroke="#c0392b" stroke-width="2"/>
<path d="M400,250 a30,20 0 0 1 -60,0" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>

<text x="320" y="370" font-size="14" text-anchor="middle" fill="#c0392b">Eddy currents circulate to oppose the increasing flux (Lenz's law)</text>

</svg>
