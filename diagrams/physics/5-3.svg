<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect width="640" height="400" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">Stationary Waves in Air Columns</text>

<!-- Left pipe: open-open -->
<text x="180" y="55" text-anchor="middle" font-size="14" fill="#1a1a1a">Open at both ends</text>
<line x1="120" y1="70" x2="120" y2="340" stroke="#1a1a1a" stroke-width="3"/>
<line x1="240" y1="70" x2="240" y2="340" stroke="#1a1a1a" stroke-width="3"/>
<line x1="150" y1="340" x2="150" y2="340" stroke="#1a1a1a" stroke-width="3"/>
<path d="M 120 205 Q 180 150 240 205" fill="none" stroke="#2a6fdb" stroke-width="2"/>
<path d="M 120 205 Q 180 260 240 205" fill="none" stroke="#2a6fdb" stroke-width="2"/>
<text x="110" y="150" text-anchor="end" font-size="14" fill="#d9534f">A</text>
<text x="250" y="150" font-size="14" fill="#d9534f">A</text>

<!-- Right pipe: closed-open -->
<text x="460" y="55" text-anchor="middle" font-size="14" fill="#1a1a1a">Closed at bottom, open at top</text>
<line x1="400" y1="70" x2="400" y2="340" stroke="#1a1a1a" stroke-width="3"/>
<line x1="520" y1="70" x2="520" y2="340" stroke="#1a1a1a" stroke-width="3"/>
<line x1="400" y1="340" x2="520" y2="340" stroke="#1a1a1a" stroke-width="3"/>
<path d="M 400 340 Q 460 150 520 70" fill="none" stroke="#2a9d3a" stroke-width="2"/>
<text x="420" y="330" font-size="14" fill="#d9534f">N</text>
<text x="525" y="85" font-size="14" fill="#d9534f">A</text>
<text x="460" y="365" text-anchor="middle" font-size="14" fill="#1a1a1a">closed end</text>

</svg>
