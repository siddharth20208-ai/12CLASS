<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
    <marker id="arrowY" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b7950b"/>
    </marker>
  </defs>
  <text x="320" y="20" font-size="16" text-anchor="middle" fill="black">Photoelectric Effect Setup</text>

  <!-- evacuated glass tube -->
  <rect x="150" y="60" width="340" height="130" rx="20" fill="none" stroke="black" stroke-width="2"/>

  <!-- cathode C -->
  <rect x="190" y="75" width="10" height="100" fill="#444"/>
  <text x="178" y="200" font-size="14" fill="black">C (cathode)</text>

  <!-- anode A -->
  <rect x="430" y="75" width="10" height="100" fill="#444"/>
  <text x="420" y="200" font-size="14" fill="black">A (anode)</text>

  <!-- incident light rays -->
  <line x1="100" y1="90" x2="188" y2="110" stroke="#b7950b" stroke-width="2" marker-end="url(#arrowY)"/>
  <line x1="100" y1="110" x2="188" y2="125" stroke="#b7950b" stroke-width="2" marker-end="url(#arrowY)"/>
  <line x1="100" y1="130" x2="188" y2="140" stroke="#b7950b" stroke-width="2" marker-end="url(#arrowY)"/>
  <text x="70" y="75" font-size="14" fill="#b7950b">incident light</text>

  <!-- photoelectrons -->
  <line x1="202" y1="125" x2="425" y2="125" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowA)"/>
  <text x="270" y="118" font-size="14" fill="#c0392b">photoelectrons</text>

  <!-- external circuit -->
  <line x1="195" y1="190" x2="195" y2="260" stroke="black" stroke-width="2"/>
  <line x1="435" y1="190" x2="435" y2="260" stroke="black" stroke-width="2"/>
  <line x1="195" y1="260" x2="280" y2="260" stroke="black" stroke-width="2"/>
  <line x1="350" y1="260" x2="435" y2="260" stroke="black" stroke-width="2"/>

  <!-- battery symbol -->
  <line x1="280" y1="245" x2="280" y2="275" stroke="black" stroke-width="3"/>
  <line x1="295" y1="250" x2="295" y2="270" stroke="black" stroke-width="1.5"/>
  <line x1="280" y1="260" x2="280" y2="260" stroke="black"/>
  <line x1="295" y1="260" x2="310" y2="260" stroke="black" stroke-width="2"/>
  <line x1="310" y1="245" x2="310" y2="275" stroke="black" stroke-width="3"/>
  <line x1="325" y1="250" x2="325" y2="270" stroke="black" stroke-width="1.5"/>
  <line x1="310" y1="260" x2="310" y2="260" stroke="black"/>
  <line x1="325" y1="260" x2="350" y2="260" stroke="black" stroke-width="2"/>
  <text x="255" y="300" font-size="13" fill="black">battery (variable)</text>

  <!-- microammeter -->
  <circle cx="400" cy="260" r="18" fill="white" stroke="black" stroke-width="2"/>
  <text x="394" y="265" font-size="14" fill="black">uA</text>
  <text x="368" y="300" font-size="13" fill="black">microammeter</text>
  <line x1="365" y1="260" x2="382" y2="260" stroke="black" stroke-width="2"/>
  <line x1="418" y1="260" x2="435" y2="260" stroke="black" stroke-width="2"/>
</svg>
