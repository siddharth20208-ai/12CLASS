<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1a5276"/></marker>
</defs>
<!-- N pole curved -->
<path d="M120,120 Q200,180 120,280 L60,280 Q140,180 60,120 Z" fill="none" stroke="black" stroke-width="2"/>
<text x="75" y="205" font-size="18">N</text>
<!-- S pole curved -->
<path d="M400,120 Q320,180 400,280 L460,280 Q380,180 460,120 Z" fill="none" stroke="black" stroke-width="2"/>
<text x="425" y="205" font-size="18">S</text>

<!-- rectangular coil between poles -->
<rect x="190" y="150" width="140" height="100" fill="none" stroke="black" stroke-width="2"/>
<text x="210" y="205" font-size="14">Coil</text>

<!-- radial field lines N to coil to S -->
<line x1="130" y1="160" x2="190" y2="160" stroke="#1a5276" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="130" y1="200" x2="190" y2="200" stroke="#1a5276" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="130" y1="240" x2="190" y2="240" stroke="#1a5276" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="330" y1="160" x2="390" y2="160" stroke="#1a5276" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="330" y1="200" x2="390" y2="200" stroke="#1a5276" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="330" y1="240" x2="390" y2="240" stroke="#1a5276" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="330" y="130" font-size="12" fill="#1a5276">radial field</text>

<!-- pointer shaft up to scale -->
<line x1="260" y1="150" x2="260" y2="80" stroke="black" stroke-width="2"/>
<line x1="260" y1="80" x2="310" y2="60" stroke="black" stroke-width="2"/>
<path d="M200,60 A80,30 0 0 1 340,60" fill="none" stroke="black" stroke-width="2"/>
<text x="220" y="45" font-size="14">Scale</text>

<!-- spring providing restoring torque -->
<path d="M260,250 q10,10 0,20 q-10,10 0,20 q10,10 0,20" stroke="#117864" stroke-width="2" fill="none"/>
<text x="275" y="300" font-size="14" fill="#117864">Spring (restoring torque)</text>

<text x="60" y="380" font-size="15">Moving-Coil Galvanometer</text>
</svg>
