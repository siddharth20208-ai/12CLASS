<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="arrow15-4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Transistor body: base vertical line, two slanted leads -->
  <line x1="300" y1="130" x2="300" y2="270" stroke="#333" stroke-width="2"/>
  <!-- base lead -->
  <line x1="220" y1="200" x2="300" y2="200" stroke="#333" stroke-width="2"/>
  <text x="200" y="195" font-size="15" text-anchor="end">base</text>
  <!-- collector lead (top) -->
  <line x1="300" y1="150" x2="380" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="110" x2="380" y2="70" stroke="#333" stroke-width="2"/>
  <text x="300" y="135" font-size="15" text-anchor="end">collector</text>
  <!-- emitter lead with arrow pointing out (NPN) -->
  <line x1="300" y1="250" x2="380" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrow15-4)"/>
  <line x1="380" y1="290" x2="380" y2="330" stroke="#333" stroke-width="2"/>
  <text x="395" y="320" font-size="15">emitter</text>

  <!-- Base circuit: battery Vbb forward biasing base-emitter -->
  <line x1="130" y1="200" x2="220" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="200" x2="130" y2="330" stroke="#333" stroke-width="2"/>
  <!-- battery symbol Vbb -->
  <line x1="110" y1="245" x2="150" y2="245" stroke="#333" stroke-width="3"/>
  <line x1="118" y1="260" x2="142" y2="260" stroke="#333" stroke-width="1.5"/>
  <text x="165" y="255" font-size="14" fill="#1a3c8c">Vbb (forward bias)</text>
  <line x1="130" y1="270" x2="130" y2="330" stroke="#333" stroke-width="2"/>

  <!-- input signal source on base line -->
  <circle cx="130" cy="200" r="0" />
  <text x="130" y="175" font-size="14" text-anchor="middle" fill="#1a3c8c">input signal</text>
  <line x1="130" y1="180" x2="130" y2="200" stroke="#1a3c8c" stroke-width="2"/>

  <!-- Collector circuit: load resistor RL to Vcc, reverse biasing CB junction -->
  <rect x="380" y="70" width="30" height="40" fill="none" stroke="#b02a2a" stroke-width="2"/>
  <line x1="395" y1="70" x2="395" y2="50" stroke="#333" stroke-width="2"/>
  <text x="440" y="65" font-size="15" fill="#b02a2a">load RL</text>
  <line x1="395" y1="50" x2="480" y2="50" stroke="#333" stroke-width="2"/>
  <!-- Vcc battery -->
  <line x1="480" y1="50" x2="480" y2="68" stroke="#333" stroke-width="2"/>
  <line x1="465" y1="68" x2="495" y2="68" stroke="#333" stroke-width="3"/>
  <line x1="470" y1="83" x2="490" y2="83" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="100" font-size="13" fill="#333">Vcc (reverse</text>
  <text x="500" y="116" font-size="13" fill="#333">bias CB)</text>
  <line x1="480" y1="83" x2="480" y2="330" stroke="#333" stroke-width="2"/>

  <!-- common emitter ground / common line -->
  <line x1="130" y1="330" x2="480" y2="330" stroke="#333" stroke-width="2"/>

  <!-- output taken at collector -->
  <line x1="395" y1="110" x2="395" y2="130" stroke="#2a8c4a" stroke-width="2"/>
  <line x1="430" y1="130" x2="430" y2="330" stroke="#2a8c4a" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="440" y="230" font-size="14" fill="#2a8c4a">output</text>

  <text x="320" y="25" font-size="16" text-anchor="middle">n-p-n Transistor, Common Emitter Configuration</text>
</svg>
