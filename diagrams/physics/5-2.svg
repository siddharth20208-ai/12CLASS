<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect width="640" height="400" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">Modes of a String Fixed at Both Ends</text>

<!-- Row 1: fundamental -->
<line x1="80" y1="100" x2="560" y2="100" stroke="#1a1a1a" stroke-width="3"/>
<circle cx="80" cy="100" r="5" fill="#1a1a1a"/>
<circle cx="560" cy="100" r="5" fill="#1a1a1a"/>
<path d="M 80 100 Q 320 60 560 100" fill="none" stroke="#2a6fdb" stroke-width="2"/>
<text x="320" y="48" text-anchor="middle" font-size="14" fill="#2a6fdb">Fundamental (1 loop)</text>
<text x="590" y="104" font-size="14" fill="#1a1a1a">n</text>

<!-- Row 2: first overtone -->
<line x1="80" y1="190" x2="560" y2="190" stroke="#1a1a1a" stroke-width="3"/>
<circle cx="80" cy="190" r="5" fill="#1a1a1a"/>
<circle cx="320" cy="190" r="5" fill="#1a1a1a"/>
<circle cx="560" cy="190" r="5" fill="#1a1a1a"/>
<path d="M 80 190 Q 200 155 320 190" fill="none" stroke="#2a9d3a" stroke-width="2"/>
<path d="M 320 190 Q 440 225 560 190" fill="none" stroke="#2a9d3a" stroke-width="2"/>
<text x="320" y="138" text-anchor="middle" font-size="14" fill="#2a9d3a">First overtone (2 loops)</text>
<text x="590" y="194" font-size="14" fill="#1a1a1a">2n</text>

<!-- Row 3: second overtone -->
<line x1="80" y1="290" x2="560" y2="290" stroke="#1a1a1a" stroke-width="3"/>
<circle cx="80" cy="290" r="5" fill="#1a1a1a"/>
<circle cx="240" cy="290" r="5" fill="#1a1a1a"/>
<circle cx="400" cy="290" r="5" fill="#1a1a1a"/>
<circle cx="560" cy="290" r="5" fill="#1a1a1a"/>
<path d="M 80 290 Q 160 258 240 290" fill="none" stroke="#d9534f" stroke-width="2"/>
<path d="M 240 290 Q 320 322 400 290" fill="none" stroke="#d9534f" stroke-width="2"/>
<path d="M 400 290 Q 480 258 560 290" fill="none" stroke="#d9534f" stroke-width="2"/>
<text x="320" y="238" text-anchor="middle" font-size="14" fill="#d9534f">Second overtone (3 loops)</text>
<text x="590" y="294" font-size="14" fill="#1a1a1a">3n</text>

</svg>
