<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <text x="320" y="26" font-size="16" text-anchor="middle" font-weight="bold">Modes of a String Fixed at Both Ends</text>

  <!-- fixed-end markers reused per row -->
  <!-- Row 1: fundamental, n -->
  <line x1="90" y1="90" x2="430" y2="90" stroke="black" stroke-width="2"/>
  <path d="M90,90 Q260,40 430,90" fill="none" stroke="#2980b9" stroke-width="2.5"/>
  <circle cx="90" cy="90" r="4" fill="#c0392b"/>
  <circle cx="430" cy="90" r="4" fill="#c0392b"/>
  <text x="70" y="94" font-size="13" text-anchor="end">N</text>
  <text x="450" y="94" font-size="13" text-anchor="start">N</text>
  <text x="260" y="58" font-size="13" text-anchor="middle">A</text>
  <text x="470" y="70" font-size="14" fill="#1a1a1a">freq = n (fundamental)</text>

  <!-- Row 2: first overtone, 2n -->
  <line x1="90" y1="190" x2="430" y2="190" stroke="black" stroke-width="2"/>
  <path d="M90,190 Q175,140 260,190 T430,190" fill="none" stroke="#2980b9" stroke-width="2.5"/>
  <circle cx="90" cy="190" r="4" fill="#c0392b"/>
  <circle cx="260" cy="190" r="4" fill="#c0392b"/>
  <circle cx="430" cy="190" r="4" fill="#c0392b"/>
  <text x="70" y="194" font-size="13" text-anchor="end">N</text>
  <text x="260" y="210" font-size="13" text-anchor="middle">N</text>
  <text x="450" y="194" font-size="13" text-anchor="start">N</text>
  <text x="175" y="158" font-size="13" text-anchor="middle">A</text>
  <text x="345" y="158" font-size="13" text-anchor="middle">A</text>
  <text x="470" y="170" font-size="14" fill="#1a1a1a">freq = 2n (1st overtone)</text>

  <!-- Row 3: second overtone, 3n -->
  <line x1="90" y1="300" x2="430" y2="300" stroke="black" stroke-width="2"/>
  <path d="M90,300 Q147,255 203,300 T317,300 T430,300" fill="none" stroke="#2980b9" stroke-width="2.5"/>
  <circle cx="90" cy="300" r="4" fill="#c0392b"/>
  <circle cx="203" cy="300" r="4" fill="#c0392b"/>
  <circle cx="317" cy="300" r="4" fill="#c0392b"/>
  <circle cx="430" cy="300" r="4" fill="#c0392b"/>
  <text x="70" y="304" font-size="13" text-anchor="end">N</text>
  <text x="203" y="320" font-size="13" text-anchor="middle">N</text>
  <text x="317" y="320" font-size="13" text-anchor="middle">N</text>
  <text x="450" y="304" font-size="13" text-anchor="start">N</text>
  <text x="147" y="268" font-size="13" text-anchor="middle">A</text>
  <text x="260" y="268" font-size="13" text-anchor="middle">A</text>
  <text x="374" y="268" font-size="13" text-anchor="middle">A</text>
  <text x="470" y="280" font-size="14" fill="#1a1a1a">freq = 3n (2nd overtone)</text>
</svg>
