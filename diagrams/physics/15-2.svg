<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="arrowI" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>
  <text x="320" y="18" font-size="16" text-anchor="middle" fill="black">Full-Wave Rectifier (Centre-Tapped)</text>

  <!-- transformer -->
  <line x1="60" y1="60" x2="60" y2="140" stroke="black" stroke-width="2"/>
  <line x1="95" y1="55" x2="95" y2="145" stroke="black" stroke-width="2"/>
  <line x1="105" y1="55" x2="105" y2="95" stroke="black" stroke-width="2"/>
  <line x1="105" y1="105" x2="105" y2="145" stroke="black" stroke-width="2"/>
  <text x="40" y="45" font-size="12" fill="black">AC input</text>

  <!-- secondary centre tap -->
  <line x1="105" y1="60" x2="160" y2="60" stroke="black" stroke-width="2"/>
  <line x1="105" y1="140" x2="160" y2="140" stroke="black" stroke-width="2"/>
  <line x1="105" y1="100" x2="105" y2="180" stroke="black" stroke-width="2"/>
  <text x="80" y="195" font-size="12" fill="black">centre tap (ground)</text>
  <circle cx="105" cy="180" r="3" fill="black"/>

  <!-- D1 diode top -->
  <path d="M 160 60 L 185 60 L 185 45 L 210 60 L 185 75 L 185 60" fill="black"/>
  <line x1="210" y1="45" x2="210" y2="75" stroke="black" stroke-width="2"/>
  <text x="180" y="35" font-size="13" fill="black">D1</text>
  <line x1="210" y1="60" x2="260" y2="60" stroke="black" stroke-width="2"/>

  <!-- D2 diode bottom -->
  <path d="M 160 140 L 185 140 L 185 125 L 210 140 L 185 155 L 185 140" fill="black"/>
  <line x1="210" y1="125" x2="210" y2="155" stroke="black" stroke-width="2"/>
  <text x="180" y="170" font-size="13" fill="black">D2</text>
  <line x1="210" y1="140" x2="260" y2="140" stroke="black" stroke-width="2"/>

  <!-- load RL -->
  <rect x="260" y="80" width="30" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="300" y="105" font-size="13" fill="black">RL</text>
  <line x1="275" y1="60" x2="275" y2="80" stroke="black" stroke-width="2"/>
  <line x1="275" y1="120" x2="275" y2="140" stroke="black" stroke-width="2"/>
  <line x1="105" y1="180" x2="275" y2="180" stroke="black" stroke-width="2"/>
  <line x1="275" y1="140" x2="275" y2="180" stroke="black" stroke-width="2"/>

  <!-- input waveform -->
  <text x="130" y="230" font-size="14" fill="black">AC input waveform</text>
  <line x1="60" y1="270" x2="230" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#arrowI)"/>
  <path d="M 70 270 Q 100 230 130 270 Q 160 310 190 270 Q 210 245 225 270" stroke="#2874a6" stroke-width="2" fill="none"/>

  <!-- output waveform full wave rectified -->
  <text x="430" y="230" font-size="13" fill="black">Full-wave rectified output</text>
  <text x="430" y="247" font-size="13" fill="black">(across RL)</text>
  <line x1="360" y1="270" x2="600" y2="270" stroke="black" stroke-width="1.5" marker-end="url(#arrowI)"/>
  <path d="M 370 270 Q 390 230 410 270 M 410 270 Q 430 230 450 270 M 450 270 Q 470 230 490 270 M 490 270 Q 510 230 530 270 M 530 270 Q 550 230 570 270"
        stroke="#c0392b" stroke-width="2" fill="none"/>
</svg>
