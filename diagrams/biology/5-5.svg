<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#333333"/>
</marker>
</defs>
<!-- left guard cell (bean shape, concave side facing pore at center) -->
<path d="M150,200 C150,130 260,120 290,195 C260,270 150,270 150,200 Z" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
<!-- right guard cell mirrored -->
<path d="M490,200 C490,130 380,120 350,195 C380,270 490,270 490,200 Z" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
<!-- stomatal pore between -->
<ellipse cx="320" cy="200" rx="30" ry="25" fill="white" stroke="#333333" stroke-width="2"/>
<text x="320" y="205" font-size="13" text-anchor="middle">Pore</text>
<!-- thick inner wall near pore -->
<path d="M290,180 C300,195 300,205 290,220" stroke="#c0392b" stroke-width="5" fill="none"/>
<path d="M350,180 C340,195 340,205 350,220" stroke="#c0392b" stroke-width="5" fill="none"/>
<!-- thin outer wall -->
<path d="M150,200 C150,130 260,120 290,195" stroke="#2e7d32" stroke-width="1.5" fill="none"/>
<text x="150" y="110" font-size="14" text-anchor="middle">Guard cell</text>
<text x="320" y="320" font-size="14" text-anchor="middle">Stomatal pore</text>
<line x1="320" y1="250" x2="320" y2="310" stroke="#333333" stroke-width="1"/>
<text x="470" y="170" font-size="14" text-anchor="middle">Thick inner wall</text>
<line x1="440" y1="175" x2="358" y2="195" stroke="#333333" stroke-width="1"/>
<text x="500" y="260" font-size="14" text-anchor="middle">Thin outer wall</text>
<line x1="470" y1="255" x2="420" y2="230" stroke="#333333" stroke-width="1"/>
<text x="150" y="300" font-size="14" text-anchor="middle">K+ ions</text>
<circle cx="190" cy="210" r="4" fill="#2e7d32"/>
<circle cx="210" cy="230" r="4" fill="#2e7d32"/>
<line x1="170" y1="285" x2="195" y2="220" stroke="#333333" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
