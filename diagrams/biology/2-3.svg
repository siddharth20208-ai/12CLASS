<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect width="640" height="400" fill="white"/>
<text x="320" y="20" font-size="16" text-anchor="middle">Pedigree Chart</text>
<text x="30" y="90" font-size="14">I</text>
<text x="30" y="200" font-size="14">II</text>
<text x="30" y="310" font-size="14">III</text>
<g stroke="#000" stroke-width="2" fill="none">
<!-- Gen I -->
<rect x="100" y="70" width="30" height="30" fill="#333"/>
<circle cx="200" cy="85" r="16"/>
<line x1="130" y1="85" x2="184" y2="85"/>
<line x1="165" y1="85" x2="165" y2="130"/>

<!-- Gen II -->
<rect x="120" y="180" width="30" height="30"/>
<circle cx="200" cy="195" r="16" fill="#333"/>
<rect x="280" y="180" width="30" height="30"/>
<circle cx="360" cy="195" r="16"/>
<line x1="150" y1="195" x2="184" y2="195"/>
<line x1="216" y1="195" x2="280" y2="195" stroke-dasharray="4,3"/>
<line x1="310" y1="195" x2="344" y2="195"/>
<line x1="165" y1="130" x2="135" y2="180"/>
<line x1="165" y1="130" x2="200" y2="180"/>
<line x1="265" y1="195" x2="265" y2="240"/>

<!-- Gen III -->
<circle cx="220" cy="300" r="16" fill="#333"/>
<rect x="300" y="285" width="30" height="30"/>
<circle cx="390" cy="300" r="16"/>
<line x1="265" y1="240" x2="220" y2="285"/>
<line x1="265" y1="240" x2="315" y2="285"/>
<line x1="330" y1="300" x2="374" y2="300"/>
</g>
<text x="95" y="60" font-size="12" text-anchor="middle">affected male</text>
<text x="200" y="60" font-size="12" text-anchor="middle">unaffected female</text>
<text x="200" y="165" font-size="11" text-anchor="middle">affected female</text>
<text x="360" y="165" font-size="11" text-anchor="middle">unaffected male</text>
<rect x="420" y="330" width="16" height="16" fill="#333"/>
<text x="445" y="343" font-size="12">= affected</text>
<rect x="420" y="355" width="16" height="16" fill="none" stroke="#000" stroke-width="2"/>
<text x="445" y="368" font-size="12">= unaffected</text>
</svg>
