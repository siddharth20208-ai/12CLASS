<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<!-- dendrites -->
<line x1="30" y1="150" x2="75" y2="170" stroke="#333333" stroke-width="2"/>
<line x1="30" y1="190" x2="75" y2="185" stroke="#333333" stroke-width="2"/>
<line x1="30" y1="230" x2="75" y2="200" stroke="#333333" stroke-width="2"/>
<line x1="30" y1="170" x2="55" y2="160" stroke="#333333" stroke-width="2"/>
<text x="55" y="130" font-size="14" text-anchor="middle">Dendrite</text>
<!-- cell body -->
<circle cx="110" cy="190" r="40" fill="#fdf3e3" stroke="#333333" stroke-width="2"/>
<circle cx="110" cy="190" r="12" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="110" y="250" font-size="14" text-anchor="middle">Cell body</text>
<text x="110" y="195" font-size="12" text-anchor="middle">Nucleus</text>
<!-- axon with myelin sheath segments -->
<line x1="150" y1="190" x2="520" y2="190" stroke="#333333" stroke-width="2"/>
<text x="330" y="150" font-size="14" text-anchor="middle">Axon</text>
<g>
<rect x="170" y="178" width="55" height="24" rx="10" fill="#e8f0fd" stroke="#2e5fa3" stroke-width="2"/>
<rect x="235" y="178" width="55" height="24" rx="10" fill="#e8f0fd" stroke="#2e5fa3" stroke-width="2"/>
<rect x="300" y="178" width="55" height="24" rx="10" fill="#e8f0fd" stroke="#2e5fa3" stroke-width="2"/>
<rect x="365" y="178" width="55" height="24" rx="10" fill="#e8f0fd" stroke="#2e5fa3" stroke-width="2"/>
<rect x="430" y="178" width="55" height="24" rx="10" fill="#e8f0fd" stroke="#2e5fa3" stroke-width="2"/>
</g>
<text x="330" y="235" font-size="14" text-anchor="middle">Myelin sheath</text>
<line x1="330" y1="205" x2="330" y2="225" stroke="#333333" stroke-width="1"/>
<!-- node of ranvier gap labelled -->
<line x1="227" y1="280" x2="227" y2="200" stroke="#333333" stroke-width="1"/>
<text x="227" y="295" font-size="13" text-anchor="middle">Node of Ranvier</text>
<!-- axon terminals, branched -->
<path d="M520,190 L560,160" stroke="#333333" stroke-width="2"/>
<path d="M520,190 L565,190" stroke="#333333" stroke-width="2"/>
<path d="M520,190 L560,220" stroke="#333333" stroke-width="2"/>
<text x="580" y="195" font-size="13" text-anchor="start">Axon</text>
<text x="580" y="210" font-size="13" text-anchor="start">terminal</text>
</svg>
