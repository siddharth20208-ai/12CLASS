<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<text x="150" y="30" font-size="16" text-anchor="middle">Eye</text>
<text x="480" y="30" font-size="16" text-anchor="middle">Ear</text>
<!-- EYE cross-section -->
<ellipse cx="150" cy="150" rx="95" ry="70" fill="none" stroke="#333333" stroke-width="2"/>
<!-- cornea front curved layer -->
<path d="M60,110 Q40,150 60,190" stroke="#2e5fa3" stroke-width="3" fill="none"/>
<text x="35" y="100" font-size="12" text-anchor="middle">Cornea</text>
<!-- iris and pupil -->
<rect x="65" y="130" width="8" height="40" fill="#333333"/>
<text x="50" y="205" font-size="12" text-anchor="middle">Iris &amp;</text>
<text x="50" y="219" font-size="12" text-anchor="middle">pupil</text>
<!-- lens -->
<ellipse cx="90" cy="150" rx="8" ry="30" fill="#e8f0fd" stroke="#2e5fa3" stroke-width="2"/>
<text x="110" y="205" font-size="12" text-anchor="middle">Lens</text>
<!-- retina at back -->
<path d="M240,85 Q250,150 240,215" stroke="#c0392b" stroke-width="3" fill="none"/>
<text x="245" y="235" font-size="12" text-anchor="middle">Retina</text>
<!-- optic nerve leaving back -->
<line x1="245" y1="150" x2="290" y2="150" stroke="#333333" stroke-width="3"/>
<text x="290" y="135" font-size="12" text-anchor="middle">Optic</text>
<text x="290" y="170" font-size="12" text-anchor="middle">nerve</text>

<!-- EAR -->
<!-- outer ear: pinna and canal -->
<path d="M380,170 C360,150 365,110 395,105 C420,100 430,130 415,150 C425,160 420,175 405,175 C400,185 390,185 380,170 Z" fill="none" stroke="#333333" stroke-width="2"/>
<text x="390" y="90" font-size="12" text-anchor="middle">Pinna</text>
<line x1="415" y1="150" x2="455" y2="150" stroke="#333333" stroke-width="2"/>
<text x="435" y="135" font-size="11" text-anchor="middle">Canal</text>
<!-- ear drum -->
<line x1="455" y1="130" x2="455" y2="170" stroke="#c0392b" stroke-width="3"/>
<text x="455" y="190" font-size="11" text-anchor="middle">Ear drum</text>
<!-- three ossicles -->
<circle cx="470" cy="140" r="4" fill="#2e5fa3"/>
<circle cx="480" cy="148" r="4" fill="#2e5fa3"/>
<circle cx="490" cy="140" r="4" fill="#2e5fa3"/>
<text x="480" y="115" font-size="11" text-anchor="middle">Ossicles</text>
<line x1="480" y1="120" x2="480" y2="135" stroke="#333333" stroke-width="1"/>
<!-- cochlea coiled -->
<path d="M500,150 a15,15 0 1,1 10,20 a8,8 0 1,1 5,-10" fill="none" stroke="#333333" stroke-width="2"/>
<text x="510" y="195" font-size="11" text-anchor="middle">Cochlea</text>
<!-- semicircular canals -->
<path d="M495,120 Q510,90 540,95" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M500,115 Q525,80 555,100" fill="none" stroke="#333333" stroke-width="2"/>
<path d="M505,110 Q540,75 565,110" fill="none" stroke="#333333" stroke-width="2"/>
<text x="560" y="75" font-size="11" text-anchor="middle">Semicircular</text>
<text x="560" y="90" font-size="11" text-anchor="middle">canals</text>
</svg>
