<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect width="640" height="400" fill="white"/>
<text x="150" y="20" font-size="15" text-anchor="middle">DNA Double Helix</text>
<text x="470" y="20" font-size="15" text-anchor="middle">Nucleosome</text>

<g stroke="#000" stroke-width="2" fill="none">
<path d="M90,40 C150,80 60,120 90,160 C150,200 60,240 90,280 C150,320 60,360 90,390"/>
<path d="M210,40 C150,80 240,120 210,160 C150,200 240,240 210,280 C150,320 240,360 210,390"/>
</g>
<g stroke="#555" stroke-width="2" stroke-dasharray="4,3">
<line x1="94" y1="55" x2="206" y2="55"/>
<line x1="80" y1="90" x2="220" y2="90"/>
<line x1="94" y1="125" x2="206" y2="125"/>
<line x1="80" y1="160" x2="220" y2="160"/>
<line x1="94" y1="195" x2="206" y2="195"/>
<line x1="80" y1="230" x2="220" y2="230"/>
<line x1="94" y1="265" x2="206" y2="265"/>
<line x1="80" y1="300" x2="220" y2="300"/>
<line x1="94" y1="335" x2="206" y2="335"/>
</g>
<text x="20" y="40" font-size="12">Sugar-phosphate</text>
<text x="20" y="55" font-size="12">backbone</text>
<text x="100" y="105" font-size="11" fill="#b22222">A-T</text>
<text x="100" y="175" font-size="11" fill="#1e5aa8">G-C</text>
<text x="100" y="245" font-size="11" fill="#b22222">A-T</text>
