<text x="470" y="170" font-size="12" text-anchor="middle">octamer</text>
<path d="M400,110 C520,70 560,150 520,195 C480,230 400,210 410,170 C415,140 440,130 470,145" fill="none" stroke="#000" stroke-width="2"/>
<line x1="400" y1="110" x2="340" y2="90" stroke="#000" stroke-width="2"/>
<line x1="410" y1="170" x2="340" y2="200" stroke="#000" stroke-width="2"/>
