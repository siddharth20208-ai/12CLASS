<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <text x="155" y="25" font-size="16" fill="#222" text-anchor="middle">Upright pyramid</text>

  <!-- Upright: wide base at bottom narrowing to top -->
  <polygon points="40,320 270,320 230,250 80,250" fill="#eaf5ea" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="80,250 230,250 205,190 105,190" fill="#dff0d8" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="105,190 205,190 185,140 125,140" fill="#cfe8cf" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="125,140 185,140 155,95 155,95" fill="#bfe0bf" stroke="#1a1a1a" stroke-width="2"/>
  <text x="155" y="290" font-size="13" text-anchor="middle">Producers</text>
  <text x="155" y="225" font-size="13" text-anchor="middle">Herbivores</text>
  <text x="155" y="170" font-size="12" text-anchor="middle">Carnivores</text>
  <text x="155" y="70" font-size="11" text-anchor="middle">Top carnivores</text>
  <line x1="155" y1="95" x2="155" y2="80" stroke="#1a1a1a" stroke-width="1"/>

  <text x="480" y="25" font-size="16" fill="#222" text-anchor="middle">Inverted pyramid</text>
  <text x="480" y="45" font-size="12" fill="#444" text-anchor="middle">(example: pond biomass)</text>

  <!-- Inverted: narrow at bottom, wide at top (upside-down pyramid) -->
  <polygon points="470,320 490,320 495,280 465,280" fill="#bfe0bf" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="465,280 495,280 505,230 455,230" fill="#cfe8cf" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="455,230 505,230 520,170 440,170" fill="#dff0d8" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="440,170 520,170 540,95 420,95" fill="#eaf5ea" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="305" font-size="9" text-anchor="middle">Top carn.</text>
  <text x="480" y="260" font-size="12" text-anchor="middle">Carnivores</text>
  <text x="480" y="205" font-size="13" text-anchor="middle">Herbivores</text>
  <text x="480" y="135" font-size="13" text-anchor="middle">Producers</text>
</svg>
