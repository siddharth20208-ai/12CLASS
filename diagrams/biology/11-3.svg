<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow11" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Gel tray -->
  <rect x="150" y="60" width="300" height="260" fill="#e8f5e9" stroke="#222222" stroke-width="2"/>
  <text x="300" y="40" font-size="16" text-anchor="middle" fill="#222222">Agarose Gel Electrophoresis</text>

  <!-- Wells -->
  <rect x="170" y="70" width="20" height="18" fill="#9e9e9e" stroke="#222222" stroke-width="2"/>
  <rect x="230" y="70" width="20" height="18" fill="#9e9e9e" stroke="#222222" stroke-width="2"/>
  <rect x="290" y="70" width="20" height="18" fill="#9e9e9e" stroke="#222222" stroke-width="2"/>
  <rect x="350" y="70" width="20" height="18" fill="#9e9e9e" stroke="#222222" stroke-width="2"/>
  <text x="300" y="68" font-size="14" text-anchor="middle" fill="#222222">Wells</text>

  <!-- Lanes with bands -->
  <!-- lane 1 -->
  <rect x="170" y="140" width="20" height="6" fill="#c62828"/>
  <rect x="170" y="190" width="20" height="6" fill="#c62828"/>
  <rect x="170" y="260" width="20" height="6" fill="#c62828"/>
  <!-- lane 2 -->
  <rect x="230" y="120" width="20" height="6" fill="#c62828"/>
  <rect x="230" y="210" width="20" height="6" fill="#c62828"/>
  <rect x="230" y="280" width="20" height="6" fill="#c62828"/>
  <!-- lane 3 -->
  <rect x="290" y="150" width="20" height="6" fill="#c62828"/>
  <rect x="290" y="230" width="20" height="6" fill="#c62828"/>
  <!-- lane 4 -->
  <rect x="350" y="130" width="20" height="6" fill="#c62828"/>
  <rect x="350" y="200" width="20" height="6" fill="#c62828"/>
  <rect x="350" y="270" width="20" height="6" fill="#c62828"/>

  <text x="195" y="135" font-size="12" fill="#222222">Larger fragments (moved less)</text>
  <text x="195" y="300" font-size="12" fill="#222222">Smaller fragments (moved farther)</text>

  <!-- Direction arrow -->
  <line x1="470" y1="90" x2="470" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow11)"/>
  <text x="480" y="100" font-size="13" fill="#1565c0">Direction of</text>
  <text x="480" y="118" font-size="13" fill="#1565c0">DNA movement</text>

  <!-- Electrodes -->
  <line x1="150" y1="335" x2="450" y2="335" stroke="#2e7d32" stroke-width="3"/>
  <text x="180" y="360" font-size="14" text-anchor="middle" fill="#222222">Negative electrode (-)</text>
  <text x="420" y="360" font-size="14" text-anchor="middle" fill="#222222">Positive electrode (+)</text>
</svg>
