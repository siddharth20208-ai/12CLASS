<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#333333"/>
</marker>
</defs>
<!-- heart outline: four chambers, note anatomical right is viewer's left -->
<!-- Right atrium (viewer left top) -->
<rect x="190" y="90" width="110" height="80" rx="12" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
<text x="245" y="135" font-size="14" text-anchor="middle">Right</text>
<text x="245" y="152" font-size="14" text-anchor="middle">atrium</text>
<!-- Left atrium (viewer right top) -->
<rect x="330" y="90" width="110" height="80" rx="12" fill="#e8f0fd" stroke="#2e5fa3" stroke-width="2"/>
<text x="385" y="135" font-size="14" text-anchor="middle">Left</text>
<text x="385" y="152" font-size="14" text-anchor="middle">atrium</text>
<!-- Right ventricle (viewer left bottom) -->
<rect x="190" y="190" width="110" height="110" rx="12" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
<text x="245" y="260" font-size="14" text-anchor="middle">Right</text>
<text x="245" y="277" font-size="14" text-anchor="middle">ventricle</text>
<!-- Left ventricle (viewer right bottom) -->
<rect x="330" y="190" width="110" height="110" rx="12" fill="#e8f0fd" stroke="#2e5fa3" stroke-width="2"/>
<text x="385" y="260" font-size="14" text-anchor="middle">Left</text>
<text x="385" y="277" font-size="14" text-anchor="middle">ventricle</text>
<!-- tricuspid valve between RA and RV -->
<line x1="190" y1="183" x2="300" y2="183" stroke="#333333" stroke-width="3" stroke-dasharray="6,4"/>
<text x="150" y="187" font-size="13" text-anchor="end">Tricuspid valve</text>
<!-- bicuspid (mitral) valve between LA and LV -->
<line x1="330" y1="183" x2="440" y2="183" stroke="#333333" stroke-width="3" stroke-dasharray="6,4"/>
<text x="480" y="187" font-size="13" text-anchor="start">Bicuspid valve</text>
<!-- vena cava entering right atrium -->
<line x1="245" y1="35" x2="245" y2="88" stroke="#7a2a2a" stroke-width="5" marker-end="url(#arrow)"/>
<text x="245" y="25" font-size="13" text-anchor="middle">Vena cava</text>
<!-- pulmonary veins entering left atrium -->
<line x1="385" y1="35" x2="385" y2="88" stroke="#2e5fa3" stroke-width="5" marker-end="url(#arrow)"/>
<text x="385" y="25" font-size="13" text-anchor="middle">Pulmonary veins</text>
<!-- pulmonary artery leaving right ventricle -->
<path d="M220,190 L220,345 L160,345" stroke="#7a2a2a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="120" y="350" font-size="13" text-anchor="end">Pulmonary artery</text>
<!-- aorta leaving left ventricle -->
<path d="M410,190 L410,345 L470,345" stroke="#2e5fa3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="510" y="350" font-size="13" text-anchor="start">Aorta</text>
<!-- semilunar valves -->
<line x1="213" y1="200" x2="227" y2="200" stroke="#333333" stroke-width="3"/>
<line x1="403" y1="200" x2="417" y2="200" stroke="#333333" stroke-width="3"/>
<text x="320" y="225" font-size="13" text-anchor="middle">Semilunar valves</text>
</svg>
