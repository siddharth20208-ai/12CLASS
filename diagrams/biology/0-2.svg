<text x="80" y="180" font-size="13">Pollen grains</text>

<!-- Ovule -->
<g stroke="#000" stroke-width="2" fill="none">
<ellipse cx="470" cy="90" rx="90" ry="55"/>
<ellipse cx="470" cy="90" rx="75" ry="42"/>
<ellipse cx="480" cy="90" rx="30" ry="22"/>
</g>
<circle cx="460" cy="90" r="6" fill="#2e8b57"/>
