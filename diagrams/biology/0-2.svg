</g>
<!-- 4 pollen sacs -->
<circle cx="95" cy="75" r="18" fill="none" stroke="#000" stroke-width="2"/>
<circle cx="95" cy="105" r="18" fill="none" stroke="#000" stroke-width="2"/>
<circle cx="205" cy="75" r="18" fill="none" stroke="#000" stroke-width="2"/>
<circle cx="205" cy="105" r="18" fill="none" stroke="#000" stroke-width="2"/>
<g fill="#b8860b">
<circle cx="90" cy="70" r="2"/><circle cx="98" cy="78" r="2"/><circle cx="92" cy="82" r="2"/>
