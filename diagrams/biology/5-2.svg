<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<!-- cell wall -->
<rect x="170" y="80" width="300" height="240" fill="none" stroke="#333333" stroke-width="2"/>
<text x="320" y="60" font-size="16" text-anchor="middle">Cell wall</text>
<line x1="170" y1="80" x2="220" y2="110" stroke="#333333" stroke-width="1"/>
<!-- shrunken protoplast, offset from wall leaving gap -->
<ellipse cx="320" cy="210" rx="100" ry="80" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
<circle cx="340" cy="200" r="18" fill="none" stroke="#2e7d32" stroke-width="2"/>
<text x="340" y="205" font-size="14" text-anchor="middle">N</text>
<text x="320" y="215" font-size="14" text-anchor="middle">Shrunken protoplast</text>
<!-- gap label with arrow pointing to the space between wall and protoplast -->
<line x1="500" y1="130" x2="420" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="120" font-size="14" text-anchor="middle">Gap filled with</text>
<text x="500" y="138" font-size="14" text-anchor="middle">external solution</text>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
</marker>
</defs>
</svg>
