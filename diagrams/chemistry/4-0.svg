<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<defs>
  <marker id="arrow4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
  </marker>
</defs>
<rect x="0" y="0" width="640" height="400" fill="white"/>
<text x="320" y="18" font-size="16" text-anchor="middle" font-weight="bold">Galvanic (Daniell) Cell</text>

<!-- Left beaker -->
<path d="M100,120 L100,320 L220,320 L220,120" stroke="black" stroke-width="2" fill="none"/>
<rect x="100" y="150" width="120" height="170" fill="#aed6f1" opacity="0.5"/>
<text x="160" y="345" font-size="14" text-anchor="middle">ZnSO4 solution</text>
<text x="160" y="365" font-size="15" text-anchor="middle" font-weight="bold">Anode, oxidation</text>

<!-- Right beaker -->
<path d="M420,120 L420,320 L540,320 L540,120" stroke="black" stroke-width="2" fill="none"/>
<rect x="420" y="150" width="120" height="170" fill="#f9e79f" opacity="0.5"/>
<text x="480" y="345" font-size="14" text-anchor="middle">CuSO4 solution</text>
<text x="480" y="365" font-size="15" text-anchor="middle" font-weight="bold">Cathode, reduction</text>

<!-- Zn rod -->
<rect x="150" y="80" width="20" height="150" fill="#7f8c8d" stroke="black" stroke-width="2"/>
<text x="160" y="75" font-size="14" text-anchor="middle">Zn</text>

<!-- Cu rod -->
<rect x="470" y="80" width="20" height="150" fill="#cb6b2d" stroke="black" stroke-width="2"/>
<text x="480" y="75" font-size="14" text-anchor="middle">Cu</text>

<!-- U-tube salt bridge -->
<path d="M220,260 L260,260 L260,340 L380,340 L380,260 L420,260" stroke="black" stroke-width="2" fill="none"/>
<rect x="263" y="263" width="114" height="74" fill="#d5f5e3" opacity="0.6"/>
<text x="320" y="330" font-size="13" text-anchor="middle">KCl salt bridge</text>

<!-- wire with voltmeter -->
<path d="M160,80 L160,40 L480,40 L480,80" stroke="black" stroke-width="2" fill="none"/>
<circle cx="320" cy="40" r="20" stroke="black" stroke-width="2" fill="white"/>
<text x="320" y="46" font-size="16" text-anchor="middle">V</text>

<!-- electron flow arrow -->
<path d="M200,40 L380,40" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow4)"/>
<text x="230" y="60" font-size="13" fill="#c0392b" text-anchor="middle">electron flow</text>

</svg>
