<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<defs>
  <marker id="arrow54" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L4,2 L0,4 Z" fill="black"/>
  </marker>
  <marker id="arrow54b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,4 L4,2 L0,0 Z" fill="#c0392b"/>
  </marker>
</defs>
<rect x="0" y="0" width="640" height="400" fill="white"/>
<text x="320" y="30" font-size="18" text-anchor="middle" font-weight="bold">Reaction Energy Profile</text>

<line x1="60" y1="340" x2="60" y2="60" stroke="black" stroke-width="2" marker-end="url(#arrow54)"/>
<line x1="60" y1="340" x2="600" y2="340" stroke="black" stroke-width="2" marker-end="url(#arrow54)"/>
<text x="10" y="70" font-size="14">Energy</text>
<text x="500" y="365" font-size="14">Reaction coordinate</text>

<!-- curve: reactants -> hump -> products -->
<path d="M100,260 C180,260 220,120 320,120 C420,120 460,220 560,220" stroke="#2980b9" stroke-width="2" fill="none"/>

<text x="90" y="285" font-size="14">Reactants</text>
<text x="300" y="100" font-size="14">activated complex</text>
<text x="520" y="245" font-size="14">Products</text>

<!-- Ea double arrow -->
<line x1="260" y1="260" x2="260" y2="122" stroke="#c0392b" stroke-width="2" marker-start="url(#arrow54b)" marker-end="url(#arrow54)"/>
<text x="265" y="190" font-size="14" fill="#c0392b">Ea (activation energy)</text>
</svg>
