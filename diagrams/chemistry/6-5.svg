<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
<rect x="0" y="0" width="640" height="400" fill="white"/>
<text x="320" y="30" font-size="18" text-anchor="middle" font-weight="bold">Xenon Fluoride Structures</text>

<!-- XeF2: linear -->
<g>
  <line x1="60" y1="150" x2="200" y2="150" stroke="black" stroke-width="2"/>
  <circle cx="60" cy="150" r="14" fill="#aed6f1" stroke="black" stroke-width="2"/>
  <text x="60" y="155" font-size="13" text-anchor="middle">F</text>
  <circle cx="130" cy="150" r="18" fill="#f9e79f" stroke="black" stroke-width="2"/>
  <text x="130" y="155" font-size="13" text-anchor="middle">Xe</text>
  <circle cx="200" cy="150" r="14" fill="#aed6f1" stroke="black" stroke-width="2"/>
  <text x="200" y="155" font-size="13" text-anchor="middle">F</text>
  <text x="130" y="210" font-size="14" text-anchor="middle">XeF2 (linear)</text>
</g>

<!-- XeF4: square planar -->
<g>
  <circle cx="320" cy="150" r="18" fill="#f9e79f" stroke="black" stroke-width="2"/>
  <text x="320" y="155" font-size="13" text-anchor="middle">Xe</text>
  <line x1="320" y1="150" x2="320" y2="90" stroke="black" stroke-width="2"/>
  <line x1="320" y1="150" x2="320" y2="210" stroke="black" stroke-width="2"/>
  <line x1="320" y1="150" x2="260" y2="150" stroke="black" stroke-width="2"/>
  <line x1="320" y1="150" x2="380" y2="150" stroke="black" stroke-width="2"/>
  <circle cx="320" cy="90" r="13" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="320" y="95" font-size="12" text-anchor="middle">F</text>
  <circle cx="320" cy="210" r="13" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="320" y="215" font-size="12" text-anchor="middle">F</text>
  <circle cx="260" cy="150" r="13" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="260" y="155" font-size="12" text-anchor="middle">F</text>
  <circle cx="380" cy="150" r="13" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="380" y="155" font-size="12" text-anchor="middle">F</text>
  <text x="320" y="245" font-size="14" text-anchor="middle">XeF4 (square planar)</text>
</g>

<!-- XeF6: distorted octahedral -->
<g>
  <circle cx="520" cy="150" r="18" fill="#f9e79f" stroke="black" stroke-width="2"/>
  <text x="520" y="155" font-size="13" text-anchor="middle">Xe</text>
  <line x1="520" y1="150" x2="520" y2="85" stroke="black" stroke-width="2"/>
  <line x1="520" y1="150" x2="520" y2="215" stroke="black" stroke-width="2"/>
  <line x1="520" y1="150" x2="460" y2="150" stroke="black" stroke-width="2"/>
  <line x1="520" y1="150" x2="580" y2="150" stroke="black" stroke-width="2"/>
  <line x1="520" y1="150" x2="480" y2="110" stroke="black" stroke-width="2"/>
  <line x1="520" y1="150" x2="565" y2="190" stroke="black" stroke-width="2"/>
  <circle cx="520" cy="85" r="12" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="520" y="89" font-size="11" text-anchor="middle">F</text>
  <circle cx="520" cy="215" r="12" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="520" y="219" font-size="11" text-anchor="middle">F</text>
  <circle cx="460" cy="150" r="12" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="460" y="154" font-size="11" text-anchor="middle">F</text>
  <circle cx="580" cy="150" r="12" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="580" y="154" font-size="11" text-anchor="middle">F</text>
  <circle cx="480" cy="110" r="12" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="480" y="114" font-size="11" text-anchor="middle">F</text>
  <circle cx="565" cy="190" r="12" fill="#aed6f1" stroke="black" stroke-width="2"/><text x="565" y="194" font-size="11" text-anchor="middle">F</text>
  <text x="520" y="245" font-size="14" text-anchor="middle">XeF6 (distorted octahedral)</text>
</g>
</svg>
