<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222222"/>
    </marker>
  </defs>

  <!-- Axes, x-axis through middle, parabola symmetric about it -->
  <line x1="60" y1="200" x2="580" y2="200" stroke="#222222" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="150" y1="360" x2="150" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="590" y="205" font-size="16">x</text>
  <text x="135" y="35" font-size="16">y</text>
  <text x="130" y="220" font-size="14">O</text>

  <!-- Parabola y^2=4ax opening right, symmetric about x-axis -->
  <path d="M 150 200 Q 330 40 430 90" fill="none" stroke="#222222" stroke-width="2"/>
  <path d="M 150 200 Q 330 360 430 310" fill="none" stroke="#222222" stroke-width="2"/>

  <!-- vertical line at x=a -->
  <line x1="430" y1="90" x2="430" y2="310" stroke="#1f6fd1" stroke-width="2"/>
  <text x="422" y="330" font-size="14">a</text>

  <!-- Shade top half between curve and x-axis up to x=a -->
  <path d="M 150 200 Q 330 40 430 90 L 430 200 Z" fill="#e67e22" fill-opacity="0.4" stroke="none"/>
  <text x="250" y="150" font-size="15" fill="#e67e22">Top area</text>

  <!-- Mirror image bottom half, marked equal area -->
  <path d="M 150 200 Q 330 360 430 310 L 430 200 Z" fill="#8e44ad" fill-opacity="0.25" stroke="none"/>
  <text x="235" y="270" font-size="15" fill="#8e44ad">Bottom area (equal area)</text>
</svg>
