<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>
  <!-- axes -->
  <line x1="80" y1="340" x2="600" y2="340" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="340" x2="80" y2="40" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="345" font-size="15">x</text>
  <text x="65" y="35" font-size="15">y</text>
  <text x="70" y="358" font-size="14">O</text>

  <!-- constraint line 1: x+y=5  from (0,5) to (5,0) scaled -->
  <!-- scale: 1 unit = 80px, origin at (80,340) -->
  <line x1="80" y1="60" x2="480" y2="340" stroke="#1a66cc" stroke-width="2"/>
  <text x="440" y="330" font-size="14" fill="#1a66cc">x+y=5</text>
  <circle cx="80" cy="60" r="3" fill="#1a66cc"/>
  <text x="55" y="58" font-size="13">(0,5)</text>
  <circle cx="480" cy="340" r="3" fill="#1a66cc"/>
  <text x="470" y="358" font-size="13">(5,0)</text>

  <!-- constraint line 2: 2x+y=8 -> (0,8) to (4,0) -->
  <line x1="138" y1="40" x2="400" y2="340" stroke="#cc3333" stroke-width="2"/>
  <text x="330" y="330" font-size="14" fill="#cc3333">2x+y=8</text>
  <circle cx="400" cy="340" r="3" fill="#cc3333"/>
  <text x="390" y="358" font-size="13">(4,0)</text>

  <!-- intersection point of the two lines: x+y=5, 2x+y=8 -> x=3,y=2 -->
  <circle cx="320" cy="180" r="4" fill="#1a1a1a"/>
  <text x="326" y="176" font-size="13">(3,2)</text>

  <!-- feasible region: polygon O(0,0),(4,0),(3,2),(0,5) shaded -->
  <polygon points="80,340 400,340 320,180 80,60" fill="#2e8b57" fill-opacity="0.35" stroke="none"/>
  <text x="150" y="300" font-size="15" fill="#1a1a1a" font-weight="bold">Feasible Region</text>

  <text x="480" y="60" font-size="14" fill="#444">Shaded = region satisfying</text>
  <text x="480" y="80" font-size="14" fill="#444">all constraints &amp; x,y &#8805; 0</text>
</svg>
