<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow0" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222222"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="60" y1="330" x2="580" y2="330" stroke="#222222" stroke-width="2" marker-end="url(#arrow0)"/>
  <line x1="60" y1="330" x2="60" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#arrow0)"/>
  <text x="590" y="335" font-size="16">x</text>
  <text x="45" y="35" font-size="16">y</text>
  <text x="40" y="345" font-size="14">O</text>

  <!-- Curve rising from left to right above x-axis -->
  <path d="M 120 300 Q 300 100 520 150" fill="none" stroke="#222222" stroke-width="2"/>

  <!-- Vertical lines at x=a and x=b -->
  <line x1="200" y1="330" x2="200" y2="240" stroke="#1f6fd1" stroke-width="2"/>
  <line x1="420" y1="330" x2="420" y2="167" stroke="#1f6fd1" stroke-width="2"/>

  <!-- Shaded region between curve, x-axis, x=a and x=b (curve clipped) -->
  <clipPath id="clip0">
    <rect x="200" y="0" width="220" height="330"/>
  </clipPath>
  <path d="M 120 300 Q 300 100 520 150 L 520 330 L 120 330 Z" fill="#e67e22" fill-opacity="0.35" stroke="none" clip-path="url(#clip0)"/>

  <text x="195" y="350" font-size="14">a</text>
  <text x="415" y="350" font-size="14">b</text>
  <text x="280" y="260" font-size="16" fill="#e67e22">Area</text>
</svg>
