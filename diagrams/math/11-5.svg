<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222222"/>
    </marker>
    <clipPath id="clip5">
      <path d="M 170 290 L 330 150 L 470 230 L 330 330 Z"/>
    </clipPath>
  </defs>

  <line x1="60" y1="330" x2="580" y2="330" stroke="#222222" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="60" y1="330" x2="60" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="590" y="335" font-size="16">x</text>
  <text x="45" y="35" font-size="16">y</text>
  <text x="40" y="345" font-size="14">O</text>

  <!-- 3 curves/lines -->
  <line x1="100" y1="90" x2="520" y2="330" stroke="#1f6fd1" stroke-width="2"/>
  <line x1="100" y1="330" x2="520" y2="150" stroke="#c0392b" stroke-width="2"/>
  <path d="M 90 150 Q 330 310 540 120" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Shaded final bounded region (illustrative) -->
  <path d="M 170 290 L 330 150 L 470 230 L 330 330 Z" fill="#8e44ad" fill-opacity="0.3" stroke="none"/>

  <!-- Intersection points -->
  <circle cx="170" cy="290" r="4" fill="#222222"/>
  <text x="130" y="305" font-size="13">(x1,y1)</text>
  <circle cx="330" cy="150" r="4" fill="#222222"/>
  <text x="335" y="140" font-size="13">(x2,y2)</text>
  <circle cx="470" cy="230" r="4" fill="#222222"/>
  <text x="478" y="225" font-size="13">(x3,y3)</text>

  <text x="200" y="375" font-size="16" fill="#8e44ad">Bounded region</text>
</svg>
