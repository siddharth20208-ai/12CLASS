<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#222222"/>
    </marker>
    <clipPath id="clip3a">
      <path d="M 90 300 Q 300 130 500 280 Q 300 380 90 300 Z"/>
    </clipPath>
  </defs>

  <!-- Left: vertical rectangle dx -->
  <line x1="60" y1="330" x2="580" y2="330" stroke="#222222" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="60" y1="330" x2="60" y2="40" stroke="#222222" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="590" y="335" font-size="16">x</text>
  <text x="45" y="35" font-size="16">y</text>

  <path d="M 90 300 Q 300 130 500 280 Q 300 380 90 300 Z" fill="#27ae60" fill-opacity="0.25" stroke="#222222" stroke-width="2"/>

  <!-- thin vertical rectangle representing dx -->
  <rect x="235" y="195" width="14" height="140" fill="#1f6fd1" fill-opacity="0.6" stroke="#1f6fd1" stroke-width="1" clip-path="url(#clip3a)"/>
  <text x="255" y="350" font-size="14" fill="#1f6fd1">dx</text>
  <text x="200" y="245" font-size="14" fill="#1f6fd1">height</text>

  <!-- thin horizontal rectangle representing dy -->
  <rect x="330" y="258" width="110" height="14" fill="#c0392b" fill-opacity="0.6" stroke="#c0392b" stroke-width="1" clip-path="url(#clip3a)"/>
  <text x="445" y="270" font-size="14" fill="#c0392b">dy</text>
  <text x="340" y="300" font-size="14" fill="#c0392b">width</text>

  <text x="140" y="365" font-size="16">Bounded region between two curves</text>
</svg>
